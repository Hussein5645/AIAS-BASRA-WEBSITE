<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - AIAS Basra</title>
    <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'DM Sans', sans-serif;
            background: radial-gradient(circle at 85% 15%, rgba(240, 218, 161, 0.25), transparent 40%),
                        linear-gradient(135deg, #321c22 0%, #661f22 55%, #8c3e43 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
        }

        .container {
            background: #fffdfa;
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(22, 10, 13, 0.45);
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(102, 31, 34, 0.12);
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            text-align: center;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #661f22, #8c3e43);
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 10px 25px rgba(102, 31, 34, 0.28);
        }

        h1 {
            color: #2b171c;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #7a6e70;
            font-size: 0.88rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .message {
            padding: 0.85rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            font-size: 0.86rem;
            display: none;
            text-align: start;
        }

        .message.error {
            background: #fff3f3;
            color: #a12d35;
            border: 1px solid #f3c2c5;
            display: block;
        }

        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .google-btn {
            width: 100%;
            min-height: 52px;
            padding: 0 1.25rem;
            background: #fff;
            color: #2b171c;
            border: 1.5px solid #ded3cc;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            box-shadow: 0 4px 14px rgba(42, 24, 28, 0.05);
        }

        .google-btn:hover {
            border-color: #661f22;
            box-shadow: 0 8px 24px rgba(102, 31, 34, 0.16);
            transform: translateY(-2px);
        }

        .google-btn svg {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid #efe8e3;
            color: #7a6e70;
            font-size: 0.88rem;
        }

        .signup-link a {
            color: #661f22;
            font-weight: 800;
            text-decoration: none;
            margin-inline-start: 4px;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .language-toggle-auth {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
            color: white;
            padding: 0.5rem 0.85rem;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.8rem;
            transition: background 0.2s ease;
        }

        .language-toggle-auth:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .language-toggle-auth svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2.25rem 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
<script type="module" src="/js/product-navigation.js"></script>
</head>
<body>
    <button class="language-toggle-auth" id="languageToggle" aria-label="Change language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="currentLang">EN</span>
    </button>

    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">🏛️</div>
        </div>

        <h1 data-en="Sign in to AIAS Basra" data-ar="تسجيل الدخول إلى AIAS البصرة">Sign in to AIAS Basra</h1>
        <p class="subtitle" data-en="One account for BASRA Professional, Market, and the main website." data-ar="حساب واحد للمحترفين والسوق والموقع الرئيسي.">One account for BASRA Professional, Market, and the main website.</p>

        <div id="message" class="message"></div>

        <button type="button" class="google-btn" id="googleSignIn">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span data-en="Sign in with Google" data-ar="تسجيل الدخول عبر Google">Sign in with Google</span>
        </button>

        <div class="signup-link">
            <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
            <a href="signup.html" id="signupLink" data-en="Create account here" data-ar="أنشئ حساباً هنا">Create account here</a>
        </div>
    </div>

    <script>
        let currentLanguage = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);

            document.documentElement.lang = lang === 'ar' ? 'ar' : 'en';
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.title = lang === 'ar' ? 'تسجيل الدخول - AIAS البصرة' : 'Sign in - AIAS Basra';

            const currentLang = document.getElementById('currentLang');
            if (currentLang) {
                currentLang.textContent = lang === 'ar' ? 'AR' : 'EN';
            }

            const elements = document.querySelectorAll('[data-en][data-ar]');
            elements.forEach((element) => {
                const translation = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
                if (translation) {
                    element.textContent = translation;
                }
            });
        }

        const languageToggle = document.getElementById('languageToggle');
        if (languageToggle) {
            languageToggle.addEventListener('click', () => {
                const newLang = currentLanguage === 'en' ? 'ar' : 'en';
                setLanguage(newLang);
            });
        }

        setLanguage(currentLanguage);
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp, getApp } from "/js/cloudflare-client.js";
        import { getAuth, signInWithCredential, GoogleAuthProvider, onAuthStateChanged } from "/js/cloudflare-client.js";
        import { getFirestore, doc, getDoc } from "/js/cloudflare-client.js";
        import { getAdminAccess, persistAccessSession } from "./js/rbac.js";

        const firebaseConfig = { projectId: "aias-basra" };

        let app;
        try {
            app = getApp();
        } catch (error) {
            app = initializeApp(firebaseConfig);
        }
        const auth = getAuth(app);
        const db = getFirestore(app);

        const messageDiv = document.getElementById('message');
        const googleSignInBtn = document.getElementById('googleSignIn');
        const signupLink = document.getElementById('signupLink');
        const requestedNext = new URLSearchParams(window.location.search).get('next') || '';

        function safeNext(fallback) {
            try {
                const target = new URL(requestedNext || fallback, location.origin);
                const trusted = ['aiasbsr.com','professional.aiasbsr.com','market.aiasbsr.com','community.aiasbsr.com'];
                return target.origin === location.origin || target.protocol === 'https:' && trusted.includes(target.hostname) && !target.port && !target.username && !target.password ? target.href : fallback;
            } catch { return fallback; }
        }

        function signupDestination() {
            return requestedNext ? 'signup.html?next=' + encodeURIComponent(requestedNext) : 'signup.html';
        }

        if (signupLink) {
            signupLink.href = signupDestination();
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }





        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const profileSnap = await getDoc(doc(db, 'users', user.uid));
                if (!profileSnap.exists() || !profileSnap.data().profileComplete) {
                    window.location.href = signupDestination();
                    return;
                }
                showMessage('You are signed in. Opening your account…', 'success');
                await checkUserRoleAndRedirect(user);
            }
        });

        async function checkUserRoleAndRedirect(user) {
            try {
                const access = await getAdminAccess(db, user.email);

                localStorage.setItem('aias_authenticated', 'true');
                localStorage.setItem('aias_user_email', user.email);
                localStorage.setItem('aias_user_name', user.displayName || '');
                localStorage.setItem('aias_user_picture', user.photoURL || '');
                persistAccessSession(access);
                localStorage.setItem('aias_user_uid', user.uid);
                localStorage.setItem('aias_visitor_mode', 'false');

                const destination = safeNext('/');
                window.location.href = destination === 'admin-dashboard.html'
                    ? 'https://aiasbsr.com/admin-dashboard.html'
                    : destination;
            } catch (error) {
                console.error('Error checking user role:', error);
                showMessage('Error checking user permissions. Please try again.', 'error');
            }
        }

        googleSignInBtn.addEventListener('click', async () => {
            try {
                googleSignInBtn.disabled = true;
                showMessage('Redirecting to Google...', 'success');

                const returnUrl = new URL(window.location.href);
                returnUrl.hash = '';
                const relayUrl = new URL('/api/auth/start', location.origin);
                relayUrl.searchParams.set('return', returnUrl.href);
                window.location.assign(relayUrl.href);

            } catch (error) {
                console.error('Could not start Google Sign-In redirect:', error);
                googleSignInBtn.disabled = false;
                showMessage('Sign-in failed: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>
