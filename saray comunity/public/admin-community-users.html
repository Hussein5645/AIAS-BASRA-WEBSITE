<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community User Access - AIAS Basra</title>
<style>:root{--wine:#6b2228;--muted:#68717d;--line:#e1d9d2;--bg:#f6f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif}.head{padding:20px;color:#fff;background:linear-gradient(135deg,#321c22,var(--wine),#9b5e4d)}.head>div,.page{max-width:1100px;margin:auto}.head>div,.user{display:flex;align-items:center;justify-content:space-between;gap:16px}.head h1{margin:0;font-size:1.35rem}.head p{margin:5px 0 0;color:#ead8d3;font-size:.78rem}.head a{color:#fff}.page{padding:16px}.tools{display:grid;grid-template-columns:1fr 190px;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.tools input,.tools select{min-height:43px;padding:0 12px;border:1px solid var(--line);border-radius:9px;font:inherit}.summary{color:var(--muted);font-size:.78rem}.list{display:grid;gap:9px}.user{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.user h2{margin:0;font-size:.92rem}.user p{margin:4px 0;color:var(--muted);font-size:.72rem}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#eee;font-size:.62rem;font-weight:800}.badge.pending{color:#8a4b05;background:#fff1d6}.badge.approved{color:#166534;background:#dcfce7}.badge.denied,.badge.revoked,.badge.restricted{color:#991b1b;background:#fee2e2}.actions{display:flex;gap:6px}.actions button{min-height:36px;padding:0 11px;border:0;border-radius:8px;color:#fff;background:#657080;cursor:pointer;font-weight:800}.actions .grant{background:#15803d}.actions .deny{background:#a23a42}.state{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px;background:#fff}.notice{display:none;margin-bottom:10px;padding:10px;border-radius:10px}.notice.show{display:block}.notice.ok{color:#166534;background:#dcfce7}.notice.error{color:#991b1b;background:#fee2e2}@media(max-width:650px){.head>div,.user{align-items:flex-start;flex-direction:column}.tools{grid-template-columns:1fr}}</style></head>
<body><header class="head"><div><div><h1>Main-thread posting access</h1><p>Review applications and control public publishing.</p></div><div><a href="admin-community-moderation.html">Moderation</a> · <a href="https://www.aiasbsr.com/admin-dashboard.html">Dashboard</a></div></div></header>
<main class="page"><div id="notice" class="notice"></div><section class="tools"><input id="search" type="search" placeholder="Search name, email, or username"><select id="filter"><option value="all">All users</option><option value="pending">Pending requests</option><option value="approved">Approved</option><option value="restricted">Restricted</option></select></section><p id="summary" class="summary"></p><section id="list" class="list"><div class="state">Checking administrator access…</div></section></main>
<script type="module">
import {auth,db,callFunction} from './js/firebase-client.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import {collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import {canManage,canView,getAdminAccess} from './js/rbac.js';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=[],access;
// Missing fields belong to users registered before this permission existed and are approved.
const statusOf=u=>u.mainThreadPostingAccess!==false?'approved':(u.mainThreadAccessStatus||'restricted');
function show(message,type='ok'){$('notice').className=`notice show ${type}`;$('notice').textContent=message;setTimeout(()=>$('notice').className='notice',4500)}
function render(){
  const q=$('search').value.trim().toLowerCase(),filter=$('filter').value;
  const rows=users.filter(u=>{const status=statusOf(u);return(filter==='all'||status===filter||(filter==='restricted'&&!['approved','pending'].includes(status)))&&(!q||[u.displayName,u.email,u.username].join(' ').toLowerCase().includes(q))});
  $('summary').textContent=`${rows.length} shown · ${users.filter(u=>statusOf(u)==='pending').length} pending`;
  $('list').innerHTML=rows.length?rows.map(u=>{const status=statusOf(u),editable=canManage(access,'community');return `<article class="user"><div><h2>${esc(u.displayName||u.username||'Community member')}</h2><p>${esc(u.email||'No email')} ${u.username?'· @'+esc(u.username):''}</p><span class="badge ${esc(status)}">${esc(status)}</span></div><div class="actions">${status!=='approved'?`<button class="grant" data-id="${esc(u.id)}" data-decision="grant" ${editable?'':'disabled'}>Grant access</button>`:`<button data-id="${esc(u.id)}" data-decision="revoke" ${editable?'':'disabled'}>Revoke</button>`}${status==='pending'?`<button class="deny" data-id="${esc(u.id)}" data-decision="deny" ${editable?'':'disabled'}>Deny</button>`:''}</div></article>`}).join(''):'<div class="state">No users match this filter.</div>';
  document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>review(button));
}
async function review(button){button.disabled=true;try{await callFunction('reviewMainThreadPostingAccess',{userId:button.dataset.id,decision:button.dataset.decision});show('User access updated.');await load()}catch(error){show(error.message||'Could not update access.','error');button.disabled=false}}
async function load(){$('list').innerHTML='<div class="state">Loading users…</div>';try{const snapshot=await getDocs(collection(db,'users'));users=snapshot.docs.map(item=>({id:item.id,...item.data()}));render()}catch(error){$('list').innerHTML='<div class="state">Could not load users.</div>';show(error.message||'Loading failed.','error')}}
$('search').oninput=render;$('filter').onchange=render;
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html?next=admin-community-users.html';return}access=await getAdminAccess(db,user.email);if(!canView(access,'community')){location.href='https://www.aiasbsr.com/admin-dashboard.html';return}await load()});
</script></body></html>
