<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library · AIAS Basra</title><link rel="stylesheet" href="/css/admin-workspace.css"><link rel="stylesheet" href="/css/admin-library.css"><link rel="stylesheet" href="/css/i18n.css"><script type="module" src="/js/i18n.js"></script>
</head><body>
<main><div class="workspace-page-heading"><div><h1>Files &amp; records</h1><p>Browse folders and preview stored content. This library is read-only.</p></div><span class="workspace-badge positive">Preview only</span></div>
<div class="workspace-panel-tabs" role="tablist" aria-label="Library source"><button role="tab" id="databaseTab" aria-selected="true" data-source="database">D1 records</button><button role="tab" id="mediaTab" aria-selected="false" data-source="media">R2 files</button></div>
<section class="workspace-panel"><div class="library-toolbar"><nav id="libraryBreadcrumbs" aria-label="Folder path"></nav><label><span class="sr-only">Search this folder</span><input id="librarySearch" type="search" placeholder="Search this folder…"></label></div><p id="libraryMessage" role="status" aria-live="polite"></p><div id="libraryEntries" class="library-entries" aria-busy="true"></div><button id="libraryMore" class="workspace-outline" hidden>Load more</button></section>
<dialog id="libraryPreview" aria-labelledby="previewTitle" aria-describedby="previewMetadata"><header><h2 id="previewTitle">Preview</h2><button id="previewClose" class="workspace-outline" aria-label="Close preview">×</button></header><p id="previewMetadata"></p><div id="previewContent"></div></dialog>
</main><script type="module" src="/js/admin-storage.js"></script><script type="module" src="/js/admin-shell.js"></script></body></html>
