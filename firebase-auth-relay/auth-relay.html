<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in — AIAS Basra</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font:16px/1.5 system-ui,sans-serif; color:#fff; background:#661f22; }
    main { max-width:32rem; padding:2rem; text-align:center; }
  </style>
</head>
<body>
  <main><p id="status">Connecting securely to Google…</p></main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, getRedirectResult, signInWithRedirect, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const app = initializeApp({
      apiKey: 'AIzaSyAyLFqSWDyLShllJIoqsr2Jjme47OJTPKQ',
      authDomain: 'aias-bsr.firebaseapp.com',
      projectId: 'aias-bsr',
      appId: '1:78055223814:web:99460402c2b1fcd5ae8987'
    });
    const auth = getAuth(app);
    const returnKey = 'aias_google_relay_return';
    const requestedReturn = new URLSearchParams(location.search).get('return');

    function safeReturnUrl(value) {
      try {
        const url = new URL(value);
        const allowedPage = url.pathname === '/login.html' || url.pathname === '/signup.html';
        return url.origin === 'https://www.aiasbsr.com' && allowedPage ? url : null;
      } catch {
        return null;
      }
    }

    const incomingReturn = safeReturnUrl(requestedReturn);
    if (incomingReturn) sessionStorage.setItem(returnKey, incomingReturn.href);
    const returnUrl = safeReturnUrl(sessionStorage.getItem(returnKey));

    function returnToWebsite(values) {
      if (!returnUrl) throw new Error('The sign-in return address is invalid.');
      const destination = new URL(returnUrl.href);
      destination.hash = new URLSearchParams(values).toString();
      sessionStorage.removeItem(returnKey);
      location.replace(destination.href);
    }

    try {
      if (!returnUrl) throw new Error('Open Google sign-in from the AIAS Basra website.');
      const result = await getRedirectResult(auth);
      if (result) {
        const credential = GoogleAuthProvider.credentialFromResult(result);
        if (!credential?.idToken && !credential?.accessToken) throw new Error('Google did not return a usable credential.');
        returnToWebsite({
          google_id_token: credential.idToken || '',
          google_access_token: credential.accessToken || ''
        });
      } else {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await signInWithRedirect(auth, provider);
      }
    } catch (error) {
      console.error('Google authentication relay failed:', error);
      if (returnUrl) returnToWebsite({ auth_error: error?.message || 'Google sign-in failed.' });
      document.getElementById('status').textContent = error?.message || 'Google sign-in failed.';
    }
  </script>
</body>
</html>
