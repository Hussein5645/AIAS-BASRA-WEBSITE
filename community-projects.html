<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Community Projects — AIAS Basra</title><link rel="icon" type="image/png" href="static/images/branding/LOGO.png"><link rel="stylesheet" href="css/style.css"><style>.projects{padding:8rem 1rem 4rem;max-width:1100px;margin:auto}.projects h1{color:var(--primary-color)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem;margin-top:2rem}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:1.25rem;box-shadow:var(--shadow-sm)}.card iframe{max-width:100%;border:0;border-radius:8px}.meta{color:#64748b;font-size:.9rem}.empty{color:#64748b;padding:2rem 0}</style><script type="module" src="js/auth.js"></script></head><body><nav class="navbar" id="navbar"></nav><main class="projects"><h1>Community Projects</h1><p>Selected work from the AIAS Basra Community.</p><div id="projects" class="grid"><p class="empty">Loading selected projects…</p></div></main><script type="module">import{initializeApp,getApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';const c={apiKey:'AIzaSyAyLFqSWDyLShllJIoqsr2Jjme47OJTPKQ',authDomain:'aias-bsr.firebaseapp.com',projectId:'aias-bsr',storageBucket:'aias-bsr.firebasestorage.app',messagingSenderId:'78055223814',appId:'1:78055223814:web:99460402c2b1fcd5ae8987'};let a;try{a=getApp()}catch{a=initializeApp(c)}const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const d=getFirestore(a),box=document.getElementById('projects');try{const posts=(await getDocs(collection(d,'communityPosts'))).docs.map(x=>({id:x.id,...x.data()})).filter(x=>x.featured);box.innerHTML=posts.length?posts.map(p=>`<article class="card"><p class="meta">${esc(p.authorName||'Member')} · ${p.type==='behance'?'Behance project':'Article'}</p><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p>${p.type==='behance'?`<iframe src="${esc(p.behanceSrc)}" width="404" height="316" allowfullscreen loading="lazy"></iframe>`:`<a class="btn btn-primary" href="community.html">Read in Community</a>`}</article>`).join(''):'<p class="empty">Featured community projects will appear here.</p>'}catch(e){box.innerHTML='<p class="empty">Projects are currently unavailable.</p>';console.error(e)}</script><script src="js/site-shell.js"></script></body></html>
