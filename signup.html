<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AIAS Basra</title>
    <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="js/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background: #fff5f5;
            color: #e53e3e;
            border-left: 4px solid #e53e3e;
            display: block;
        }

        .message.success {
            background: #f0fff4;
            color: #38a169;
            border-left: 4px solid #38a169;
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #718096;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        .google-btn {
            width: 100%;
            padding: 1rem;
            background: white;
            color: #2d3748;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .language-toggle-auth {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .language-toggle-auth svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <button class="language-toggle-auth" id="languageToggle" aria-label="Change language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="currentLang">EN</span>
    </button>

    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">🏛️</div>
        </div>
        
        <h1 data-en="Create Account" data-ar="إنشاء حساب">Create Account</h1>
        <p class="subtitle" data-en="Join the AIAS Basra Chapter community" data-ar="انضم إلى مجتمع AIAS البصرة">Join the AIAS Basra Chapter community</p>

        <div id="message" class="message"></div>

        <form id="profileSetupForm" style="margin-bottom:1.25rem;text-align:left;">
            <p style="color:#4a5568;margin:0 0 1rem;line-height:1.5;" data-en="Complete your public Community profile to finish registering." data-ar="أكمل ملف مجتمعك العام لإتمام التسجيل.">Complete your public Community profile to finish registering.</p>
            <div style="margin-bottom:.85rem;"><label for="profileName" style="display:block;font-weight:600;margin-bottom:.35rem;">Name</label><input id="profileName" required maxlength="80" style="width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;"></div>
            <div style="margin-bottom:.85rem;"><label for="profileUsername" style="display:block;font-weight:600;margin-bottom:.35rem;">Unique username</label><input id="profileUsername" required minlength="3" maxlength="24" pattern="[a-z0-9_]{3,24}" placeholder="your_handle" autocomplete="username" style="width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;"><small style="display:block;margin-top:.3rem;color:#718096;">Your permanent profile will be p/your_handle. Use lowercase letters, numbers, or underscores.</small></div>
            <div style="margin-bottom:.85rem;"><label for="profileSchool" style="display:block;font-weight:600;margin-bottom:.35rem;">School / organization</label><input id="profileSchool" required maxlength="120" style="width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;"></div>
            <div style="margin-bottom:.85rem;"><label for="profileCity" style="display:block;font-weight:600;margin-bottom:.35rem;">City</label><input id="profileCity" required maxlength="80" style="width:100%;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;"></div>
            <div style="margin-bottom:.85rem;"><label for="profileBio" style="display:block;font-weight:600;margin-bottom:.35rem;">Short bio</label><textarea id="profileBio" required maxlength="600" style="width:100%;min-height:80px;padding:.75rem;border:1px solid #cbd5e1;border-radius:8px;font:inherit;"></textarea></div>
            <button id="completeProfileBtn" type="submit" class="google-btn" style="display:none;width:100%;justify-content:center;">Complete registration</button>
        </form>

        <button type="button" class="google-btn" id="googleSignUp">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span data-en="Sign up with Google" data-ar="إنشاء حساب عبر Google">Sign up with Google</span>
        </button>

        <div class="login-link">
            <span data-en="Already have an account?" data-ar="لديك حساب بالفعل؟">Already have an account?</span>
            <a href="login.html" data-en="Login here" data-ar="سجّل الدخول هنا">Login here</a>
        </div>
    </div>

    <script>
        let currentLanguage = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);

            document.documentElement.lang = lang === 'ar' ? 'ar' : 'en';
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.title = lang === 'ar' ? 'إنشاء حساب - AIAS البصرة' : 'Sign Up - AIAS Basra';

            const currentLang = document.getElementById('currentLang');
            if (currentLang) {
                currentLang.textContent = lang === 'ar' ? 'AR' : 'EN';
            }

            const elements = document.querySelectorAll('[data-en][data-ar]');
            elements.forEach((element) => {
                const translation = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
                if (translation) {
                    element.textContent = translation;
                }
            });
        }

        const languageToggle = document.getElementById('languageToggle');
        if (languageToggle) {
            languageToggle.addEventListener('click', () => {
                const newLang = currentLanguage === 'en' ? 'ar' : 'en';
                setLanguage(newLang);
            });
        }

        setLanguage(currentLanguage);
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAdminAccess, persistAccessSession } from "./js/rbac.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAyLFqSWDyLShllJIoqsr2Jjme47OJTPKQ",
            authDomain: "aias-bsr.firebaseapp.com",
            projectId: "aias-bsr",
            storageBucket: "aias-bsr.firebasestorage.app",
            messagingSenderId: "78055223814",
            appId: "1:78055223814:web:99460402c2b1fcd5ae8987",
            measurementId: "G-6W50T4HXDV"
        };

        // Initialize Firebase (with error handling for multiple initializations)
        let app;
        try {
            app = getApp();
        } catch (error) {
            app = initializeApp(firebaseConfig);
        }
        const auth = getAuth(app);
        const db = getFirestore(app);

        const messageDiv = document.getElementById('message');
        const googleSignUpBtn = document.getElementById('googleSignUp');
        const profileSetupForm = document.getElementById('profileSetupForm');
        const completeProfileBtn = document.getElementById('completeProfileBtn');
        const requestedNext = new URLSearchParams(window.location.search).get('next') || '';
        const profileFields = {
            displayName: document.getElementById('profileName'), username: document.getElementById('profileUsername'), school: document.getElementById('profileSchool'),
            city: document.getElementById('profileCity'), bio: document.getElementById('profileBio')
        };

        function safeNext(fallback) {
            return requestedNext && !requestedNext.includes('..') && /^[A-Za-z0-9_/-]+(?:\.html)?(?:\?[A-Za-z0-9_%=&.-]+)?$/.test(requestedNext)
                ? requestedNext
                : fallback;
        }

        function normalizeUsername(value) {
            return String(value || '').trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
        }

        async function claimUsername(userId) {
            const username = normalizeUsername(profileFields.username.value);
            if (!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error('Use 3–24 lowercase letters, numbers, or underscores.');
            const usernameRef = doc(db, 'usernames', username);
            await runTransaction(db, async (transaction) => {
                const snapshot = await transaction.get(usernameRef);
                if (snapshot.exists()) {
                    if (snapshot.data().userId !== userId) throw new Error('That username is already taken.');
                    return;
                }
                transaction.set(usernameRef, { userId, username, createdAt: serverTimestamp() });
            });
            profileFields.username.value = username;
            return username;
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        // Check if user is already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, 'users', user.uid));
                const profile = snap.exists() ? snap.data() : {};
                if (profile.profileComplete) checkUserRoleAndRedirect(user);
                else {
                    if (!profileFields.displayName.value) profileFields.displayName.value = profile.displayName || user.displayName || '';
                    if (!profileFields.username.value) profileFields.username.value = profile.username || '';
                    if (!profileFields.school.value) profileFields.school.value = profile.school || '';
                    if (!profileFields.city.value) profileFields.city.value = profile.city || '';
                    if (!profileFields.bio.value) profileFields.bio.value = profile.bio || '';
                    googleSignUpBtn.style.display = 'none';
                    completeProfileBtn.style.display = 'flex';
                    showMessage('Complete your profile to finish registering.', 'success');
                }
            }
        });

        async function checkUserRoleAndRedirect(user) {
            try {
                const access = await getAdminAccess(db, user.email);
                
                // Store session data
                localStorage.setItem('aias_authenticated', 'true');
                localStorage.setItem('aias_user_email', user.email);
                localStorage.setItem('aias_user_name', user.displayName || '');
                localStorage.setItem('aias_user_picture', user.photoURL || '');
                persistAccessSession(access);
                localStorage.setItem('aias_user_uid', user.uid);

                window.location.href = safeNext(access.allowed ? 'admin-dashboard.html' : 'index.html');
            } catch (error) {
                console.error('Error checking user role:', error);
                showMessage('Error checking user permissions. Please try again.', 'error');
            }
        }

        // Handle Google Sign-Up button click
        googleSignUpBtn.addEventListener('click', async () => {
            try {
                if (!profileSetupForm.reportValidity()) return;
                googleSignUpBtn.disabled = true;
                showMessage('Signing up...', 'success');

                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Check if user already exists in Firestore
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists() && userSnap.data().profileComplete) {
                    // User already exists, treat as login
                    showMessage('Account already exists. Logging you in...', 'success');
                    await setDoc(userRef, {
                        lastLogin: new Date().toISOString()
                    }, { merge: true });
                } else {
                    // New account (or an incomplete registration): save all
                    // required public profile fields before redirecting.
                    const username = await claimUsername(user.uid);
                    await setDoc(userRef, {
                        email: user.email,
                        username,
                        displayName: profileFields.displayName.value.trim(),
                        photoURL: user.photoURL,
                        school: profileFields.school.value.trim(),
                        city: profileFields.city.value.trim(),
                        bio: profileFields.bio.value.trim(),
                        profileComplete: true,
                        createdAt: new Date().toISOString(),
                        lastLogin: new Date().toISOString()
                    });
                    showMessage('Account created successfully! Redirecting...', 'success');
                }

                // Check role and redirect
                await checkUserRoleAndRedirect(user);

            } catch (error) {
                console.error('Google Sign-Up error:', error);
                googleSignUpBtn.disabled = false;
                
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('Sign-up cancelled. Please try again.', 'error');
                } else if (error.code === 'auth/popup-blocked') {
                    showMessage('Pop-up blocked. Please allow pop-ups and try again.', 'error');
                } else {
                    showMessage('Sign-up failed: ' + error.message, 'error');
                }
            }
        });

        profileSetupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const user = auth.currentUser;
            if (!user || !profileSetupForm.reportValidity()) return;
            try {
                const username = await claimUsername(user.uid);
                await setDoc(doc(db, 'users', user.uid), {
                    email: user.email, username, displayName: profileFields.displayName.value.trim(), photoURL: user.photoURL || '',
                    school: profileFields.school.value.trim(), city: profileFields.city.value.trim(), bio: profileFields.bio.value.trim(),
                    profileComplete: true, createdAt: new Date().toISOString(), lastLogin: new Date().toISOString()
                }, { merge: true });
                await checkUserRoleAndRedirect(user);
            } catch (error) { showMessage('Could not save your profile: ' + error.message, 'error'); }
        });
    </script>
</body>
</html>
