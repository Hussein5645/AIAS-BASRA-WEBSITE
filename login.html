<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIAS Basra</title>
    <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="js/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            background: #fff5f5;
            color: #e53e3e;
            border-left: 4px solid #e53e3e;
            display: block;
        }

        .message.success {
            background: #f0fff4;
            color: #38a169;
            border-left: 4px solid #38a169;
            display: block;
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #718096;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }

        .google-btn {
            width: 100%;
            padding: 1rem;
            background: white;
            color: #2d3748;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
        }

        .google-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .language-toggle-auth {
            position: fixed;
            top: 1rem;
            right: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .language-toggle-auth svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1957758165451331" crossorigin="anonymous"></script>
  <script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>
</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-1957758165451331">
  </amp-auto-ads>
    <button class="language-toggle-auth" id="languageToggle" aria-label="Change language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="currentLang">EN</span>
    </button>

    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">🏛️</div>
        </div>
        
        <h1 data-en="Welcome Back" data-ar="مرحباً بعودتك">Welcome Back</h1>
        <p class="subtitle" data-en="Login to your AIAS Basra account" data-ar="سجّل الدخول إلى حساب AIAS البصرة الخاص بك">Login to your AIAS Basra account</p>

        <div id="message" class="message"></div>

        <button type="button" class="google-btn" id="googleSignIn">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span data-en="Sign in with Google" data-ar="تسجيل الدخول عبر Google">Sign in with Google</span>
        </button>

        <div class="signup-link">
            <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
            <a href="signup.html" data-en="Sign up here" data-ar="سجل هنا">Sign up here</a>
        </div>
        <button type="button" class="google-btn" id="visitorBtn">
            <span data-en="👀 Continue as Visitor" data-ar="👀 المتابعة كزائر">👀 Continue as Visitor</span>
        </button>

    </div>

    <script>
        let currentLanguage = localStorage.getItem('language') || 'en';

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);

            document.documentElement.lang = lang === 'ar' ? 'ar' : 'en';
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.title = lang === 'ar' ? 'تسجيل الدخول - AIAS البصرة' : 'Login - AIAS Basra';

            const currentLang = document.getElementById('currentLang');
            if (currentLang) {
                currentLang.textContent = lang === 'ar' ? 'AR' : 'EN';
            }

            const elements = document.querySelectorAll('[data-en][data-ar]');
            elements.forEach((element) => {
                const translation = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
                if (translation) {
                    element.textContent = translation;
                }
            });
        }

        const languageToggle = document.getElementById('languageToggle');
        if (languageToggle) {
            languageToggle.addEventListener('click', () => {
                const newLang = currentLanguage === 'en' ? 'ar' : 'en';
                setLanguage(newLang);
            });
        }

        setLanguage(currentLanguage);
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithCredential, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAdminAccess, persistAccessSession } from "./js/rbac.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAvPMOgz1w7SFylBY8cmn9nf9GQvn-IRNI",
            authDomain: "space-42d87.firebaseapp.com",
            projectId: "space-42d87",
            storageBucket: "space-42d87.firebasestorage.app",
            messagingSenderId: "658382934950",
            appId: "1:658382934950:web:c61b6fa237b203e6bf7567",
            measurementId: "G-Q7Y482TMEY"
        };

        // Initialize Firebase (with error handling for multiple initializations)
        let app;
        try {
            app = getApp();
        } catch (error) {
            app = initializeApp(firebaseConfig);
        }
        const auth = getAuth(app);
        const db = getFirestore(app);

        const messageDiv = document.getElementById('message');
        const googleSignInBtn = document.getElementById('googleSignIn');
        const requestedNext = new URLSearchParams(window.location.search).get('next') || '';

        function safeNext(fallback) {
            return requestedNext && !requestedNext.includes('..') && /^[A-Za-z0-9_/-]+(?:\.html)?(?:\?[A-Za-z0-9_%=&.-]+)?$/.test(requestedNext)
                ? requestedNext
                : fallback;
        }

        function signupDestination() {
            return requestedNext ? 'signup.html?next=' + encodeURIComponent(requestedNext) : 'signup.html';
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        async function finishRelaySignIn() {
            const relayResult = new URLSearchParams(window.location.hash.slice(1));
            const idToken = relayResult.get('google_id_token');
            const accessToken = relayResult.get('google_access_token');
            const relayError = relayResult.get('auth_error');
            if (!idToken && !accessToken && !relayError) return;

            // Remove the credential from the address bar before doing any
            // network work or recording browser history.
            history.replaceState(null, '', window.location.pathname + window.location.search);
            if (relayError) throw new Error(relayError);
            await signInWithCredential(auth, GoogleAuthProvider.credential(idToken || null, accessToken || null));
        }

        finishRelaySignIn().catch((error) => {
            console.error('Google relay sign-in error:', error);
            googleSignInBtn.disabled = false;
            showMessage('Sign-in failed: ' + error.message, 'error');
        });

        // Check if user is already logged in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // A new Google identity cannot finish registration until it
                // has supplied its public Community profile.
                const profileSnap = await getDoc(doc(db, 'users', user.uid));
                if (!profileSnap.exists() || !profileSnap.data().profileComplete) {
                    window.location.href = signupDestination();
                    return;
                }
                showMessage('You are already signed in. Redirecting...', 'success');
                await checkUserRoleAndRedirect(user);
            }
        });

        // Continue as visitor
        const visitorBtn = document.getElementById('visitorBtn');
        visitorBtn.addEventListener('click', () => {
            localStorage.setItem('aias_authenticated', 'false');
            localStorage.setItem('aias_visitor_mode', 'true');
            window.location.href = 'index.html';
        });

        async function checkUserRoleAndRedirect(user) {
            try {
                const access = await getAdminAccess(db, user.email);
                
                // Store session data
                localStorage.setItem('aias_authenticated', 'true');
                localStorage.setItem('aias_user_email', user.email);
                localStorage.setItem('aias_user_name', user.displayName || '');
                localStorage.setItem('aias_user_picture', user.photoURL || '');
                persistAccessSession(access);
                localStorage.setItem('aias_user_uid', user.uid);
                localStorage.setItem('aias_visitor_mode', 'false');

                // Preserve an in-site destination (for example, a Community
                // post) while rejecting external redirect targets.
                window.location.href = safeNext(access.allowed ? 'admin-dashboard.html' : 'index.html');
            } catch (error) {
                console.error('Error checking user role:', error);
                showMessage('Error checking user permissions. Please try again.', 'error');
            }
        }

        // Handle Google Sign-In button click
        googleSignInBtn.addEventListener('click', async () => {
            try {
                googleSignInBtn.disabled = true;
                showMessage('Redirecting to Google...', 'success');

                const returnUrl = new URL(window.location.href);
                returnUrl.hash = '';
                const relayUrl = new URL('https://space-42d87.firebaseapp.com/auth-relay.html');
                relayUrl.searchParams.set('return', returnUrl.href);
                window.location.assign(relayUrl.href);

            } catch (error) {
                console.error('Could not start Google Sign-In redirect:', error);
                googleSignInBtn.disabled = false;
                showMessage('Sign-in failed: ' + error.message, 'error');
            }
        });
    </script>
    <script src="/js/app-open-prompt.js?v=20260811" defer></script>
</body>
</html>
