<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Models - AIAS Basra</title>
  <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/mobile-optimized.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="js/auth.js"></script>
  <style>
    .models-hero { background:var(--gradient-1); color:var(--white); padding:8rem 0 4rem; text-align:center; }
    .models-hero h1 { font-size:3rem; margin-bottom:1rem; }
    .models-section { padding:5rem 0; }
    .models-view-controls { display:flex; justify-content:flex-end; gap:.5rem; margin-bottom:1rem; }
    .models-view-controls button { border:1px solid var(--accent-light); background:var(--white); color:var(--primary-color); border-radius:8px; padding:.6rem .9rem; cursor:pointer; font-weight:600; }
    .models-view-controls button.active, .models-view-controls button:hover { background:var(--gradient-1); color:var(--white); }
    #status { text-align:center; color:var(--text-secondary); padding:1rem 0 2rem; }
    .models-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.25rem; }
    .models-list { display:flex; flex-direction:column; gap:1rem; }
    .models-list .model-card { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .models-compact { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.75rem; }
    .models-compact .model-card { padding:1rem; }
    .models-compact .model-card p { font-size:.9rem; }
    .models-timeline { max-width:900px; margin:0 auto; padding-left:2rem; border-left:3px solid var(--accent-color); }
    .models-timeline .model-card { position:relative; margin-bottom:1rem; }
    .models-timeline .model-card::before { content:''; position:absolute; left:-2.65rem; top:1.5rem; width:.9rem; height:.9rem; border:3px solid var(--white); border-radius:50%; background:var(--accent-color); box-shadow:0 0 0 2px var(--accent-color); }
    .model-card { background:var(--white); border-radius:12px; padding:1.5rem; box-shadow:var(--shadow-sm); transition:all .3s ease; }
    .model-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); }
    .model-card h2 { margin:.1rem 0 .6rem; color:var(--primary-color); font-size:1.2rem; }
    .model-card p { margin:.35rem 0; color:var(--text-secondary); }
    .view-button { display:inline-block; margin-top:1rem; padding:.7rem 1rem; border-radius:8px; background:var(--gradient-1); color:#fff; text-decoration:none; font-weight:700; }
    .view-button:hover { transform:translateY(-2px); }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1957758165451331" crossorigin="anonymous"></script>
  <script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>
</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-1957758165451331">
  </amp-auto-ads>
  <nav class="navbar" id="navbar"></nav>
  <section class="models-hero">
    <div class="container">
      <h1 class="fade-in-up" data-en="3D Models" data-ar="نماذج ثلاثية الأبعاد">3D Models</h1>
      <p class="fade-in-up delay-1" data-en="Explore uploaded GLB models in the 3D viewer." data-ar="استكشف نماذج GLB المرفوعة في العارض ثلاثي الأبعاد.">Explore uploaded GLB models in the 3D viewer.</p>
    </div>
  </section>
  <section class="models-section">
    <div class="container">
      <div class="models-view-controls" aria-label="3D model view options">
        <button type="button" class="active" data-model-view="list" data-en="List" data-ar="قائمة">List</button>
        <button type="button" data-model-view="compact" data-en="Compact" data-ar="مضغوط">Compact</button>
        <button type="button" data-model-view="timeline" data-en="Timeline" data-ar="مخطط زمني">Timeline</button>
      </div>
      <div id="status" data-en="Loading 3D models..." data-ar="جارٍ تحميل النماذج ثلاثية الأبعاد...">Loading 3D models...</div>
      <section id="modelsGrid" class="models-list" aria-live="polite"></section>
    </div>
  </section>

  <script type="module">
    import FirestoreAPI from './js/firestore-api.js';

    const status = document.getElementById('status');
    const grid = document.getElementById('modelsGrid');

    document.querySelectorAll('[data-model-view]').forEach(button => {
      button.addEventListener('click', () => {
        const view = button.dataset.modelView;
        grid.className = `models-${view}`;
        document.querySelectorAll('[data-model-view]').forEach(item => item.classList.toggle('active', item === button));
      });
    });

    async function loadModels() {
      try {
        const result = await new FirestoreAPI().getAllContent();
        if (!result.success) throw new Error(result.error || 'Could not load models.');
        const models = (result.content.models3d || [])
          .filter(model => model.code && (model.hasFile || model.hasImageChunks))
          .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));

        if (!models.length) {
          status.dataset.en = 'No uploaded GLB models are available yet.';
          status.dataset.ar = 'لا توجد نماذج GLB مرفوعة حتى الآن.';
          window.applyTranslations?.();
          return;
        }

        status.dataset.en = `${models.length} uploaded model${models.length === 1 ? '' : 's'}`;
        status.dataset.ar = `تم تحميل ${models.length} ${models.length === 1 ? 'نموذج' : 'نماذج'}`;
        window.applyTranslations?.();
        grid.innerHTML = models.map(model => `
          <article class="model-card">
            <h2>${escapeHtml(model.name || 'Untitled model')}</h2>
            <p>Code: ${escapeHtml(model.code)}</p>
            ${model.date ? `<p>Date: ${escapeHtml(model.date)}</p>` : ''}
            <a class="view-button" href="3DViewer.html?model=${encodeURIComponent(model.code)}">View in 3D</a>
          </article>
        `).join('');
      } catch (error) {
        console.error('[3D Models] Failed to load:', error);
        status.dataset.en = 'Unable to load 3D models. Please try again later.';
        status.dataset.ar = 'تعذر تحميل النماذج ثلاثية الأبعاد. يرجى المحاولة لاحقاً.';
        window.applyTranslations?.();
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
      }[character]));
    }

    loadModels();
  </script>

        <ins class="adsbygoogle"

             (adsbygoogle = window.adsbygoogle || []).push({});

    </div>

<script src="js/site-shell.js"></script>
</body>
</html>
