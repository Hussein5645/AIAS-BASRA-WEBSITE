<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - AIAS Basra</title>
  <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/mobile-optimized.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="js/auth.js"></script>
  <style>
    .article-hero { background:var(--gradient-1); color:var(--white); padding:8rem 0 4rem; text-align:center; }
    .article-hero h1 { max-width:900px; margin:0 auto 1rem; font-size:clamp(2rem,5vw,3.5rem); }
    .article-meta { opacity:.9; }
    .article-language-picker { display:inline-flex; align-items:center; gap:.6rem; margin-top:1rem; padding:.45rem .7rem; border:1px solid rgba(255,255,255,.45); border-radius:999px; font-size:.85rem; }
    .article-language-picker select { border:0; border-radius:999px; padding:.35rem .6rem; color:var(--primary-color); background:var(--white); font:inherit; }
    .article-page { max-width:900px; margin:0 auto; padding:4rem 1rem 6rem; }
    .article-cover { width:100%; max-height:460px; object-fit:cover; border-radius:14px; margin-bottom:2.5rem; box-shadow:var(--shadow-lg); }
    .article-body { color:var(--text-secondary); font-size:1.08rem; line-height:1.9; }
    .article-body h2,.article-body h3 { color:var(--primary-color); margin:2rem 0 .75rem; line-height:1.3; }
    .article-body p { margin:0 0 1.25rem; }
    .article-body ul,.article-body ol { margin:0 0 1.25rem 1.5rem; }
    .article-body a { color:var(--accent-color); }
    .article-body blockquote { border-left:4px solid var(--accent-color); margin:1.5rem 0; padding:.5rem 1rem; background:var(--light-bg); }
    .article-community { margin-top:3rem; padding-top:2rem; border-top:1px solid #e5e7eb; }
    .vote-bar { display:flex; align-items:center; gap:.75rem; margin-bottom:2rem; }
    .vote-button { border:1px solid #d1d5db; background:#fff; border-radius:10px; padding:.65rem 1rem; cursor:pointer; font-weight:700; transition:background .2s,color .2s,border-color .2s,transform .2s; }
    .vote-button:hover { transform:translateY(-1px); }
    .vote-button.upvote { color:#15803d; border-color:#86efac; }
    .vote-button.upvote:hover,.vote-button.upvote.active { color:#fff; background:#16a34a; border-color:#16a34a; }
    .vote-button.downvote { color:#b91c1c; border-color:#fca5a5; }
    .vote-button.downvote:hover,.vote-button.downvote.active { color:#fff; background:#dc2626; border-color:#dc2626; }
    .vote-score { min-width:2rem; text-align:center; font-weight:800; color:#64748b; }
    .vote-score.positive { color:#15803d; }
    .vote-score.negative { color:#b91c1c; }
    .comment-form { display:flex; gap:.75rem; margin:1rem 0 2rem; }
    .comment-form textarea { flex:1; min-height:80px; padding:.75rem; border:1px solid #d1d5db; border-radius:8px; resize:vertical; }
    .comments-list { display:grid; gap:.85rem; }
    .comment { padding:1rem; border:1px solid #e2e8f0; border-radius:12px; background:#fff; box-shadow:0 2px 8px rgba(15,23,42,.04); }
    .comment-children { display:grid; gap:.7rem; margin:.8rem 0 0 1.5rem; padding-left:1rem; border-left:2px solid #dbeafe; }
    .comment-meta { color:var(--text-light); font-size:.85rem; margin-bottom:.35rem; }
    .comment-text { white-space:pre-wrap; color:var(--text-secondary); }
    .comment-actions { display:flex; gap:.8rem; margin-top:.65rem; }
    .comment-action { border:0; background:none; color:#2563eb; cursor:pointer; padding:.2rem 0; font-weight:700; font-size:.82rem; }
    .comment-delete { color:#b91c1c; }
    .reply-form { display:flex; gap:.5rem; margin-top:.75rem; }
    .reply-form textarea { flex:1; min-height:58px; padding:.65rem; border:1px solid #cbd5e1; border-radius:8px; resize:vertical; }
    .reply-form button { align-self:flex-end; }
    .thread-toggle { color:#475569; }
    .comment-children[hidden] { display:none; }
    .community-status { min-height:1.2em; color:#b91c1c; font-size:.82rem; }
    #status { text-align:center; padding:5rem 1rem; color:var(--text-secondary); }
    @media (max-width: 768px) {
      .article-hero { padding:6.5rem .85rem 2.25rem; }
      .article-hero h1 { font-size:clamp(1.65rem,8vw,2.35rem); line-height:1.2; overflow-wrap:anywhere; }
      .article-meta { font-size:.82rem; line-height:1.5; }
      .article-language-picker { max-width:100%; font-size:.78rem; }
      .article-page { width:100%; box-sizing:border-box; padding:1.75rem .85rem 3rem; }
      .article-cover { max-height:none; aspect-ratio:16/10; margin-bottom:1.5rem; border-radius:10px; }
      .article-body { font-size:1rem; line-height:1.8; overflow-wrap:anywhere; }
      .article-body h2,.article-body h3 { margin:1.5rem 0 .65rem; }
      .article-body img { display:block; width:100%; height:auto; border-radius:9px; margin:1rem 0; }
      .article-body blockquote { margin:1.25rem 0; padding:.7rem .85rem; }
      .article-community { margin-top:2rem; padding:1.25rem .9rem 0; }
      .article-community h2 { font-size:1.35rem; }
      .article-community h3 { font-size:1.1rem; margin-top:1.5rem; }
      .vote-bar { display:grid; grid-template-columns:1fr auto 1fr; gap:.5rem; align-items:center; margin:1rem 0 1.5rem; }
      .vote-button { min-height:48px; padding:.65rem .45rem; font-size:.82rem; touch-action:manipulation; }
      .vote-score { min-width:2.5rem; font-size:1.15rem; }
      .comment-form { flex-direction:column; gap:.55rem; margin:1rem 0 1.5rem; }
      .comment-form textarea { min-height:110px; width:100%; box-sizing:border-box; font-size:1rem; }
      .comment-form button { width:100%; min-height:48px; }
      .comment { padding:1rem .7rem; margin-bottom:.6rem; border:1px solid #e5e7eb; border-radius:9px; background:#fff; }
      .comment-children { margin-left:.45rem; padding-left:.65rem; }
      .reply-form { flex-direction:column; }
      .reply-form button { width:100%; min-height:42px; }
      .comment-meta { font-size:.75rem; overflow-wrap:anywhere; }
      .comment-text { font-size:.92rem; line-height:1.65; overflow-wrap:anywhere; }
      .comment-delete { min-height:36px; margin-top:.55rem; padding:.35rem .1rem; }
    }
    @media (max-width: 420px) {
      .vote-button { font-size:.74rem; }
      .article-language-picker { width:100%; justify-content:space-between; box-sizing:border-box; }
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1957758165451331" crossorigin="anonymous"></script>
  <script async custom-element="amp-auto-ads" src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js"></script>
</head>
<body>
  <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-1957758165451331">
  </amp-auto-ads>
  <nav class="navbar" id="navbar"></nav>
  <section class="article-hero">
    <div class="container">
      <h1 id="articleTitle">Loading article...</h1>
      <div id="articleMeta" class="article-meta"></div>
      <label class="article-language-picker" for="articleLanguageSelect" hidden>
        <span data-en="Article language" data-ar="لغة المقال">Article language</span>
        <select id="articleLanguageSelect" aria-label="Choose article language"></select>
      </label>
    </div>
  </section>
  <main class="article-page">
    <div id="status" data-en="Loading article..." data-ar="جارٍ تحميل المقال...">Loading article...</div>
    <article id="articleBody" class="article-body" hidden></article>
    <section id="articleCommunity" class="article-community" hidden>
      <h2 data-en="Community" data-ar="المجتمع">Community</h2>
      <div class="vote-bar">
        <button id="upvoteButton" class="vote-button upvote" type="button" data-en="▲ Upvote" data-ar="▲ تصويت مؤيد">▲ Upvote</button>
        <span id="voteScore" class="vote-score" aria-live="polite">0</span>
        <button id="downvoteButton" class="vote-button downvote" type="button" data-en="▼ Downvote" data-ar="▼ تصويت معارض">▼ Downvote</button>
      </div>
      <h3 data-en="Comments" data-ar="التعليقات">Comments</h3>
      <p id="commentAuthMessage" data-en="Sign in to vote and comment." data-ar="سجّل الدخول للتصويت والتعليق.">Sign in to vote and comment.</p>
      <p id="communityStatus" class="community-status" aria-live="polite"></p>
      <form id="commentForm" class="comment-form" hidden>
        <textarea id="commentInput" maxlength="2000" placeholder="Share your thoughts..." data-en="Share your thoughts..." data-ar="شارك أفكارك..."></textarea>
        <button class="btn btn-primary" type="submit" data-en="Comment" data-ar="تعليق">Comment</button>
      </form>
      <div id="commentsList" class="comments-list"></div>
    </section>
  </main>

  <script type="module">
    import FirestoreAPI from './js/firestore-api.js';
    import { initializeApp, getApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, collection, getDoc, getDocs, setDoc, addDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = { apiKey:'AIzaSyAvPMOgz1w7SFylBY8cmn9nf9GQvn-IRNI', authDomain:'space-42d87.firebaseapp.com', projectId:'space-42d87', storageBucket:'space-42d87.firebasestorage.app', messagingSenderId:'658382934950', appId:'1:658382934950:web:c61b6fa237b203e6bf7567' };
    let app;
    try { app = getApp(); } catch { app = initializeApp(firebaseConfig); }
    const auth = getAuth(app);
    const db = getFirestore(app);

    const articleParams = new URLSearchParams(window.location.search);
    const id = articleParams.get('id');
    const title = document.getElementById('articleTitle');
    const meta = document.getElementById('articleMeta');
    const languagePicker = document.querySelector('.article-language-picker');
    const languageSelect = document.getElementById('articleLanguageSelect');
    const status = document.getElementById('status');
    const body = document.getElementById('articleBody');
    const community = document.getElementById('articleCommunity');
    const upvoteButton = document.getElementById('upvoteButton');
    const downvoteButton = document.getElementById('downvoteButton');
    const voteScore = document.getElementById('voteScore');
    const commentForm = document.getElementById('commentForm');
    const commentInput = document.getElementById('commentInput');
    const commentsList = document.getElementById('commentsList');
    const commentAuthMessage = document.getElementById('commentAuthMessage');
    const communityStatus = document.getElementById('communityStatus');
    let currentUser = null;
    let currentVote = 0;
    let loadedArticle = null;

    function t(en, ar) {
      return (localStorage.getItem('language') || 'en') === 'ar' ? ar : en;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, character => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
      }[character]));
    }

    function votesRef() { return collection(db, 'content', 'magazine', 'articles', id, 'votes'); }
    function commentsRef() { return collection(db, 'content', 'magazine', 'articles', id, 'comments'); }

    async function loadCommunity() {
      const votes = (await getDocs(votesRef())).docs.map(item => item.data());
      const score = votes.reduce((total, vote) => total + (Number(vote.value) || 0), 0);
      voteScore.textContent = score > 0 ? `+${score}` : score;
      voteScore.classList.toggle('positive', score > 0);
      voteScore.classList.toggle('negative', score < 0);
      currentVote = currentUser ? Number((await getDoc(doc(votesRef(), currentUser.uid))).data()?.value || 0) : 0;
      upvoteButton.classList.toggle('active', currentVote === 1);
      downvoteButton.classList.toggle('active', currentVote === -1);

      const comments = (await getDocs(commentsRef())).docs.map(item => ({ id:item.id, ...item.data() }));
      const byParent = new Map();
      comments.forEach(comment => {
        const parent = comments.some(item => item.id === comment.parentId) ? comment.parentId : null;
        if (!byParent.has(parent)) byParent.set(parent, []);
        byParent.get(parent).push(comment);
      });
      byParent.forEach(items => items.sort((a,b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0)));
      const renderComment = (comment, depth = 0) => {
        const children = byParent.get(comment.id) || [];
        const actions = `<div class="comment-actions">
          ${currentUser ? `<button class="comment-action comment-reply" data-comment-id="${comment.id}" data-user-name="${escapeHtml(comment.userName || 'Member')}" type="button">${t('Reply', 'رد')}</button>` : ''}
          ${children.length ? `<button class="comment-action thread-toggle" type="button" aria-expanded="false">${t(`Show ${children.length} ${children.length === 1 ? 'reply' : 'replies'}`, `عرض الردود (${children.length})`)}</button>` : ''}
          ${currentUser?.uid === comment.userId ? `<button class="comment-action comment-delete" data-comment-id="${comment.id}" type="button">${t('Delete', 'حذف')}</button>` : ''}
        </div>`;
        return `<article class="comment" data-depth="${depth}">
          <div class="comment-meta">${escapeHtml(comment.userName || 'Member')} · ${comment.createdAt?.toDate ? comment.createdAt.toDate().toLocaleString() : t('Just now', 'الآن')}</div>
          <div class="comment-text">${escapeHtml(comment.text)}</div>${actions}
          <div class="reply-slot"></div>
          ${children.length ? `<div class="comment-children" hidden>${children.map(child => renderComment(child, depth + 1)).join('')}</div>` : ''}
        </article>`;
      };
      const roots = byParent.get(null) || [];
      roots.sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      commentsList.innerHTML = roots.length ? roots.map(comment => renderComment(comment)).join('') : `<p>${t('No comments yet. Start the discussion.', 'لا توجد تعليقات بعد. ابدأ النقاش.')}</p>`;
      commentsList.querySelectorAll('.thread-toggle').forEach(button => button.addEventListener('click', () => {
        const children = button.closest('.comment').querySelector(':scope > .comment-children');
        const expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!expanded));
        children.hidden = expanded;
        const count = children.children.length;
        button.textContent = expanded
          ? t(`Show ${count} ${count === 1 ? 'reply' : 'replies'}`, `عرض الردود (${count})`)
          : t('Hide replies', 'إخفاء الردود');
      }));
      commentsList.querySelectorAll('.comment-reply').forEach(button => button.addEventListener('click', () => {
        commentsList.querySelectorAll('.reply-slot').forEach(slot => { slot.innerHTML = ''; });
        const slot = button.closest('.comment').querySelector(':scope > .reply-slot');
        const replyPlaceholder = escapeHtml(t(`Reply to ${button.dataset.userName}…`, `الرد على ${button.dataset.userName}…`));
        slot.innerHTML = `<form class="reply-form"><textarea maxlength="2000" required placeholder="${replyPlaceholder}"></textarea><button class="btn btn-primary" type="submit">${t('Reply', 'رد')}</button></form>`;
        const form = slot.querySelector('form');
        form.querySelector('textarea').focus();
        form.addEventListener('submit', async event => {
          event.preventDefault();
          await postComment(form.querySelector('textarea').value, button.dataset.commentId, form.querySelector('button'));
        });
      }));
      commentsList.querySelectorAll('.comment-delete').forEach(button => button.addEventListener('click', async () => {
        await deleteDoc(doc(commentsRef(), button.dataset.commentId));
        loadCommunity();
      }));
    }

    async function postComment(rawText, parentId = null, submitButton = null) {
      const text = rawText.trim();
      if (!currentUser || !text) return;
      if (submitButton) { submitButton.disabled = true; submitButton.textContent = t('Posting…', 'جارٍ النشر…'); }
      try {
        await addDoc(commentsRef(), { userId: currentUser.uid, userName: currentUser.displayName || currentUser.email || 'Member', text, parentId, createdAt: serverTimestamp() });
        commentInput.value = '';
        await loadCommunity();
      } catch (error) {
        console.error('[ArticleComment] Failed:', error);
        communityStatus.textContent = t('Commenting is unavailable. Ask an administrator to deploy the latest Firestore rules.', 'التعليق غير متاح حالياً. يجب نشر قواعد Firestore المحدثة.');
      } finally {
        if (submitButton) { submitButton.disabled = false; submitButton.textContent = parentId ? t('Reply', 'رد') : t('Comment', 'تعليق'); }
      }
    }

    async function saveVote(value) {
      if (!currentUser) { alert(t('Please sign in to vote.', 'يرجى تسجيل الدخول للتصويت.')); return; }
      upvoteButton.disabled = true;
      downvoteButton.disabled = true;
      const voteRef = doc(votesRef(), currentUser.uid);
      try {
        await setDoc(voteRef, { userId: currentUser.uid, value: currentVote === value ? 0 : value, updatedAt: serverTimestamp() });
        await loadCommunity();
      } catch (error) {
        console.error('[ArticleVote] Failed:', error);
        if (communityStatus) communityStatus.textContent = t('Voting is unavailable. Ask an administrator to deploy the latest Firestore rules.', 'التصويت غير متاح حالياً. يجب نشر قواعد Firestore المحدثة.');
      } finally {
        upvoteButton.disabled = false;
        downvoteButton.disabled = false;
      }
    }

    upvoteButton.addEventListener('click', () => saveVote(1));
    downvoteButton.addEventListener('click', () => saveVote(-1));
    commentForm.addEventListener('submit', async event => {
      event.preventDefault();
      const submitButton = commentForm.querySelector('button[type="submit"]');
      await postComment(commentInput.value, null, submitButton);
    });

    function renderArticle(article) {
      const preferredLanguage = localStorage.getItem('language') || 'en';
      const translations = article.translations || {};
      const availableLanguages = Object.keys(translations);
      const selectedLanguage = translations[preferredLanguage] ? preferredLanguage : (translations[article.defaultLanguage] ? article.defaultLanguage : availableLanguages[0]);
      const variant = translations[selectedLanguage] || article;
      if (languageSelect && availableLanguages.length > 1) {
        languageSelect.innerHTML = availableLanguages.map(lang => `<option value="${escapeHtml(lang)}">${lang === 'ar' ? 'العربية' : lang === 'en' ? 'English' : escapeHtml(lang)}</option>`).join('');
        languageSelect.value = selectedLanguage;
        languagePicker.hidden = false;
      }
      title.textContent = variant.title || 'Article';
      meta.textContent = [variant.author ? `By ${variant.author}` : '', variant.date || ''].filter(Boolean).join(' • ');
      const coverImage = variant.imageUrl || article.imageUrl || '';
      body.innerHTML = `${coverImage ? `<img class="article-cover" src="${escapeHtml(coverImage)}" alt="${escapeHtml(variant.title)}">` : ''}${variant.content || `<p>${escapeHtml(variant.summary)}</p>`}`;
      status.hidden = true;
      body.hidden = false;
      community.hidden = false;
      document.title = `${variant.title || 'Article'} - AIAS Basra`;
    }

    languageSelect?.addEventListener('change', () => {
      if (!loadedArticle) return;
      localStorage.setItem('language', languageSelect.value);
      renderArticle(loadedArticle);
    });

    async function loadArticle() {
      try {
        if (!id) throw new Error('Article ID is missing.');
        const result = await new FirestoreAPI().getAllContent();
        loadedArticle = result.success ? (result.content.magazine?.articles || []).find(item => item.id === id) : null;
        if (!loadedArticle) throw new Error('Article not found.');
        renderArticle(loadedArticle);
        await loadCommunity();
      } catch (error) {
        console.error('[Article] Failed to load:', error);
        title.textContent = t('Article unavailable', 'المقال غير متاح');
        status.textContent = t('This article could not be found.', 'تعذر العثور على هذا المقال.');
      }
    }

    loadArticle();
    onAuthStateChanged(auth, user => {
      currentUser = user;
      commentForm.hidden = !user;
      commentAuthMessage.hidden = !!user;
      loadCommunity().catch(error => console.error('[ArticleCommunity] Failed to load:', error));
    });
  </script>
