<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model & 360 Image Viewer with AR and AWS S3</title>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">
    <link rel="stylesheet" href="css/mobile-optimized.css">
    <script type="module" src="js/auth.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }

        #model-viewer,
        #pano-viewer {
            width: 100vw;
            height: 100vh;
            background: #121212;
            display: none;
        }

        #ar-button {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 20;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        #ar-button:hover {
            background: #218838;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 30;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1957758165451331" crossorigin="anonymous"></script>
</head>
<body>

    <model-viewer id="model-viewer" 
        alt="3D model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1" 
        exposure="1" 
        ar 
        ar-modes="webxr scene-viewer quick-look"
        ar-status="session-started"
        ar-scale="auto"
        src="">
    </model-viewer>
    <div id="pano-viewer"></div>
    <button id="ar-button" onclick="openAR()">View in AR</button>
    <div id="loading-screen" class="hidden">Loading content...</div>

    <script type="module">
        import FirestoreAPI from "./js/firestore-api.js";
        
        const firestoreAPI = new FirestoreAPI();
        const modelViewer = document.getElementById('model-viewer');
        const panoViewer = document.getElementById('pano-viewer');
        const arButton = document.getElementById('ar-button');
        const loadingScreen = document.getElementById('loading-screen');
        const isEmbedded = window.self !== window.top;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        let currentObjectUrl = null;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function updateArButtonVisibility(isVisible) {
            if (isEmbedded) {
                arButton.style.display = 'none';
                return;
            }
            arButton.style.display = (isMobile && isVisible) ? 'block' : 'none';
        }

        function showLoadingScreen(show, text = 'Loading content...') {
            if (!show) {
                loadingScreen.classList.add('hidden');
                return;
            }
            loadingScreen.textContent = text;
            loadingScreen.classList.remove('hidden');
        }

        function clearCurrentObjectUrl() {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
        }

        async function base64ToBlob(dataUrl) {
            if (typeof dataUrl !== 'string' || !dataUrl.trim()) {
                throw new Error('The model file is empty.');
            }
            if (dataUrl.startsWith('data:')) {
                const response = await fetch(dataUrl);
                const blob = await response.blob();
                if (!blob.size) throw new Error('The model file is empty.');
                return blob.type ? blob : new Blob([blob], { type: 'model/gltf-binary' });
            }

            // Backward-compatible fallback for chunks stored without a data URL prefix.
            const binary = atob(dataUrl.replace(/\s/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
            return new Blob([bytes], { type: 'model/gltf-binary' });
        }

        function waitForModelViewer() {
            return new Promise((resolve, reject) => {
                const onLoad = () => { cleanup(); resolve(); };
                const onError = event => { cleanup(); reject(event?.detail?.message || new Error('The GLB could not be rendered.')); };
                const cleanup = () => {
                    modelViewer.removeEventListener('load', onLoad);
                    modelViewer.removeEventListener('error', onError);
                };
                modelViewer.addEventListener('load', onLoad, { once: true });
                modelViewer.addEventListener('error', onError, { once: true });
            });
        }

        async function loadModel(prefix) {
            if (prefix.length !== 10) {
                alert('Please enter exactly 10 characters.');
                return;
            }

            showLoadingScreen(true, 'Fetching from server...');

            try {
                // Fetch the base64 chunks from Firestore
                const base64Data = await firestoreAPI.fetchModel3DFileByCode(prefix);
                if (!base64Data) {
                    showLoadingScreen(false);
                    alert('No model file found for the given code.');
                    return;
                }

                showLoadingScreen(true, 'Processing model data...');
                
                // Convert base64 data URL to Blob
                const blob = await base64ToBlob(base64Data);
                if (blob.size < 4) throw new Error('The GLB file is too small to load.');
                
                clearCurrentObjectUrl();
                currentObjectUrl = URL.createObjectURL(blob);
                
                modelViewer.style.display = 'block';
                panoViewer.style.display = 'none';
                const viewerReady = waitForModelViewer();
                modelViewer.src = currentObjectUrl;
                updateArButtonVisibility(true);
                await viewerReady;
                showLoadingScreen(false);

                const newUrl = `${window.location.origin}${window.location.pathname}?model=${prefix}`;
                window.history.replaceState(null, '', newUrl);

            } catch (err) {
                console.error('Error loading model from Firestore:', err);
                showLoadingScreen(false);
                alert('Error loading model.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const modelKey = getQueryParam('model');
            if (modelKey) {
                loadModel(modelKey);
            } else {
                updateArButtonVisibility(false);
            }
        });

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                console.log('AR session has started.');
            } else if (event.detail.status === 'not-presenting') {
                console.log('AR session has ended.');
            }
        });

        modelViewer.addEventListener('load', () => {
            showLoadingScreen(false);
        });

        modelViewer.addEventListener('error', () => {
            showLoadingScreen(false);
        });

        window.openAR = function() {
            if (isMobile && modelViewer.ar) {
                modelViewer.activateAR();
            } else {
                alert('AR is only available on mobile devices.');
            }
        }
    </script>
</body>
</html>
