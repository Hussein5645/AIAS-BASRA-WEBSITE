<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model & 360 Image Viewer with AR and AWS S3</title>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }

        #model-viewer,
        #pano-viewer {
            width: 100vw;
            height: 100vh;
            background: #121212;
            display: none;
        }

        #ar-button {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 20;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        #ar-button:hover {
            background: #218838;
        }
    </style>
    
</head>
<body>

    <model-viewer id="model-viewer" 
        alt="3D model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1" 
        exposure="1" 
        ar 
        ar-modes="webxr scene-viewer quick-look"
        ar-status="session-started"
        ar-scale="auto"
        src="">
    </model-viewer>
    <div id="pano-viewer"></div>
    <button id="ar-button" onclick="openAR()">View in AR</button>

    <script>
        AWS.config.update({
            accessKeyId: "AKIA276CMBVE77VJTOQC",
            secretAccessKey: "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",
            region: "eu-north-1",
        });

        const s3 = new AWS.S3();
        const bucketName = '3dmodle';
        const modelViewer = document.getElementById('model-viewer');
        const panoViewer = document.getElementById('pano-viewer');
        const arButton = document.getElementById('ar-button');
        const isEmbedded = window.self !== window.top;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

function updateArButtonVisibility(fileType) {
    if (isEmbedded) {
        arButton.style.display = 'none';
        return;
    }

    const isGlbOrGltf = fileType === 'gltf' || fileType === 'glb';
    arButton.style.display = (isMobile && isGlbOrGltf) ? 'block' : 'none';
}

function loadModel(prefix) {
    if (prefix.length !== 10) {
        alert('Please enter exactly 10 characters.');
        return;
    }

    s3.listObjectsV2({ Bucket: bucketName, Prefix: prefix }, (err, data) => {
        if (err) {
            console.error('Error fetching bucket contents:', err);
            alert('Error fetching bucket contents.');
            return;
        }

        // Ensure data.Contents is defined and has items
        if (data && data.Contents && data.Contents.length > 0) {
            const key = data.Contents[0].Key;
            const fileExtension = key.split('.').pop().toLowerCase();

            const signedUrl = s3.getSignedUrl('getObject', {
                Bucket: bucketName,
                Key: key,
                Expires: 3600
            });

            if (fileExtension === 'gltf' || fileExtension === 'glb') {
                modelViewer.src = signedUrl;
                modelViewer.style.display = 'block';
                panoViewer.style.display = 'none';
                updateArButtonVisibility(fileExtension);
            } else if (fileExtension === 'jpg' || fileExtension === 'jpeg' || fileExtension === 'png') {
                modelViewer.style.display = 'none';
                panoViewer.style.display = 'block';
                pannellum.viewer('pano-viewer', {
                    type: 'equirectangular',
                    panorama: signedUrl,
                    autoLoad: true
                });
                updateArButtonVisibility(fileExtension);
            } else {
                alert('Unsupported file format.');
                updateArButtonVisibility('');
            }

            const newUrl = `${window.location.origin}${window.location.pathname}?model=${prefix}`;
            window.history.replaceState(null, '', newUrl);
        } else {
            alert('No model/image found with the given prefix.');
        }
    });
}





        window.addEventListener('DOMContentLoaded', () => {
            const modelKey = getQueryParam('model');
            if (modelKey) {
                loadModel(modelKey);
            } else {
                updateArButtonVisibility('');
            }
        });

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                console.log('AR session has started.');
            } else if (event.detail.status === 'not-presenting') {
                console.log('AR session has ended.');
            }
        });

        function openAR() {
            if (isMobile && modelViewer.ar) {
                modelViewer.activateAR();
            } else {
                alert('AR is only available on mobile devices.');
            }
        }



</script>
</body>
</html>
