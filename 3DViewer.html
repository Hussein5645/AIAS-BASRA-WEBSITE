<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model & 360 Image Viewer with AR and AWS S3</title>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1117.0/dist/aws-sdk.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">
    <link rel="stylesheet" href="css/mobile-optimized.css">
    <script type="module" src="js/auth.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
        }

        #model-viewer,
        #pano-viewer {
            width: 100vw;
            height: 100vh;
            background: #121212;
            display: none;
        }

        #ar-button {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 20;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        #ar-button:hover {
            background: #218838;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 30;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    
</head>
<body>

    <model-viewer id="model-viewer" 
        alt="3D model" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1" 
        exposure="1" 
        ar 
        ar-modes="webxr scene-viewer quick-look"
        ar-status="session-started"
        ar-scale="auto"
        src="">
    </model-viewer>
    <div id="pano-viewer"></div>
    <button id="ar-button" onclick="openAR()">View in AR</button>
    <div id="loading-screen" class="hidden">Loading content...</div>

    <script>
        AWS.config.update({
            accessKeyId: "AKIA276CMBVE77VJTOQC",
            secretAccessKey: "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",
            region: "eu-north-1",
        });

        const s3 = new AWS.S3();
        const bucketName = '3dmodle';
        const modelViewer = document.getElementById('model-viewer');
        const panoViewer = document.getElementById('pano-viewer');
        const arButton = document.getElementById('ar-button');
        const loadingScreen = document.getElementById('loading-screen');
        const isEmbedded = window.self !== window.top;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        let currentObjectUrl = null;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

function updateArButtonVisibility(fileType) {
    if (isEmbedded) {
        arButton.style.display = 'none';
        return;
    }

    const isGlbOrGltf = fileType === 'gltf' || fileType === 'glb';
    arButton.style.display = (isMobile && isGlbOrGltf) ? 'block' : 'none';
}

function toMb(bytes) {
    if (!bytes || !Number.isFinite(bytes)) return '0.00';
    return (bytes / (1024 * 1024)).toFixed(2);
}

function showLoadingScreen(show, loadedBytes = 0, totalBytes = 0) {
    if (!show) {
        loadingScreen.classList.add('hidden');
        return;
    }

    if (totalBytes > 0) {
        loadingScreen.textContent = `Loading content... ${toMb(loadedBytes)} MB of ${toMb(totalBytes)} MB`;
    } else {
        loadingScreen.textContent = `Loading content... ${toMb(loadedBytes)} MB`;
    }

    loadingScreen.classList.remove('hidden');
}

function clearCurrentObjectUrl() {
    if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
    }
}

function loadModel(prefix) {
    if (prefix.length !== 10) {
        alert('Please enter exactly 10 characters.');
        return;
    }

    s3.listObjectsV2({ Bucket: bucketName, Prefix: prefix }, (err, data) => {
        if (err) {
            console.error('Error fetching bucket contents:', err);
            alert('Error fetching bucket contents.');
            return;
        }

        // Ensure data.Contents is defined and has items
        if (data && data.Contents && data.Contents.length > 0) {
            const key = data.Contents[0].Key;
            const fileExtension = key.split('.').pop().toLowerCase();
            const params = {
                Bucket: bucketName,
                Key: key,
            };

            showLoadingScreen(true, 0, 0);

            s3.headObject(params, (metaErr, metadata) => {
                const totalBytes = (!metaErr && metadata && metadata.ContentLength) ? metadata.ContentLength : 0;

                const request = s3.getObject(params);
                request.on('httpDownloadProgress', progress => {
                    const loaded = progress && Number.isFinite(progress.loaded) ? progress.loaded : 0;
                    showLoadingScreen(true, loaded, totalBytes || progress.total || 0);
                });

                request.send((downloadErr, objectData) => {
                    if (downloadErr) {
                        console.error('Error loading object:', downloadErr);
                        showLoadingScreen(false);
                        alert('Error loading object.');
                        return;
                    }

                    clearCurrentObjectUrl();
                    const mimeType = (fileExtension === 'gltf' || fileExtension === 'glb')
                        ? 'model/gltf-binary'
                        : (fileExtension === 'png' ? 'image/png' : 'image/jpeg');
                    const blob = new Blob([objectData.Body], { type: mimeType });
                    currentObjectUrl = URL.createObjectURL(blob);

                    if (fileExtension === 'gltf' || fileExtension === 'glb') {
                        modelViewer.style.display = 'block';
                        panoViewer.style.display = 'none';
                        modelViewer.src = currentObjectUrl;
                        updateArButtonVisibility(fileExtension);
                    } else if (fileExtension === 'jpg' || fileExtension === 'jpeg' || fileExtension === 'png') {
                        modelViewer.style.display = 'none';
                        panoViewer.style.display = 'block';
                        pannellum.viewer('pano-viewer', {
                            type: 'equirectangular',
                            panorama: currentObjectUrl,
                            autoLoad: true
                        });
                        updateArButtonVisibility(fileExtension);
                        showLoadingScreen(false);
                    } else {
                        alert('Unsupported file format.');
                        updateArButtonVisibility('');
                        showLoadingScreen(false);
                    }
                });
            });

            const newUrl = `${window.location.origin}${window.location.pathname}?model=${prefix}`;
            window.history.replaceState(null, '', newUrl);
        } else {
            showLoadingScreen(false);
            alert('No model/image found with the given prefix.');
        }
    });
}





        window.addEventListener('DOMContentLoaded', () => {
            const modelKey = getQueryParam('model');
            if (modelKey) {
                loadModel(modelKey);
            } else {
                updateArButtonVisibility('');
            }
        });

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                console.log('AR session has started.');
            } else if (event.detail.status === 'not-presenting') {
                console.log('AR session has ended.');
            }
        });

        modelViewer.addEventListener('load', () => {
            showLoadingScreen(false);
        });

        modelViewer.addEventListener('error', () => {
            showLoadingScreen(false);
        });

        function openAR() {
            if (isMobile && modelViewer.ar) {
                modelViewer.activateAR();
            } else {
                alert('AR is only available on mobile devices.');
            }
        }



</script>
</body>
</html>
