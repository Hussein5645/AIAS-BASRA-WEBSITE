<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(localStorage.getItem('language')==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';}}catch{}</script>
  <title>Community Project — AIAS Basra</title>
  <link rel="icon" type="image/png" href="static/images/branding/LOGO.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/community.css?v=20260811-profile-media">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { background:#eeeae4; color:#172033; }
    .project-hero { min-height:430px; display:flex; align-items:flex-end; padding:9rem 1rem 4rem; color:#fff; background:radial-gradient(circle at 82% 12%,rgba(240,218,161,.28),transparent 30%),linear-gradient(135deg,#17151a 0%,#4a2026 55%,#7b423b 100%); }
    .project-hero .container { width:100%; }
    .project-kicker { display:inline-flex; align-items:center; gap:.55rem; margin-bottom:1.4rem; color:#f0daa1; text-transform:uppercase; letter-spacing:.16em; font-size:.76rem; font-weight:800; }
    .project-kicker::before { content:''; width:34px; height:2px; background:currentColor; }
    .project-hero h1 { max-width:950px; margin:0 0 1rem; font-size:clamp(2.35rem,7vw,5.6rem); line-height:.98; letter-spacing:-.055em; overflow-wrap:anywhere; }
    .project-meta { display:flex; flex-wrap:wrap; gap:.65rem 1.5rem; color:rgba(255,255,255,.82); font-size:.94rem; }
    .project-shell { max-width:1180px; margin:-1.8rem auto 0; padding:0 1rem 6rem; position:relative; }
    .project-summary { display:grid; grid-template-columns:minmax(0,1.8fr) minmax(240px,.7fr); gap:2rem; padding:2rem; background:#fff; border-radius:22px; box-shadow:0 20px 55px rgba(39,25,28,.14); }
    .project-summary h2 { margin:0 0 .7rem; color:#6b2228; font-size:1rem; text-transform:uppercase; letter-spacing:.12em; }
    .project-summary p { margin:0; color:#526072; font-size:1.08rem; line-height:1.8; white-space:pre-wrap; }
    .project-side { display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:1rem; padding-left:1.5rem; border-left:1px solid #e7e2dc; }
    .project-side a { color:#6b2228; font-weight:800; text-decoration:none; }
    .project-badge { display:inline-flex; padding:.4rem .7rem; border-radius:999px; background:#f7efd9; color:#8a5d13; font-size:.78rem; font-weight:800; }
    .selection-request { width:100%; padding:1rem; border:1px solid #eadcc0; border-radius:14px; background:#fffaf0; }.selection-request strong { display:block; margin-bottom:.35rem; color:#6b2228; }.selection-request p { margin:0 0 .8rem; font-size:.84rem; line-height:1.55; }.selection-request button { width:100%; border:0; border-radius:10px; padding:.75rem 1rem; color:#fff; background:#6b2228; font:inherit; font-weight:800; cursor:pointer; }.selection-request button:disabled { opacity:.6; cursor:wait; }.selection-status { display:inline-flex; padding:.45rem .7rem; border-radius:999px; color:#744e0b; background:#f7efd9; font-size:.75rem; font-weight:800; }
    .project-stage { margin-top:2rem; padding:1rem; border-radius:24px; background:#17151a; box-shadow:0 22px 55px rgba(23,21,26,.18); }
    .project-stage iframe { display:block; width:100%; min-height:720px; border:0; border-radius:16px; background:#fff; }
    .project-community { margin-top:2rem; padding:2rem; background:#fff; border-radius:22px; box-shadow:0 12px 32px rgba(39,25,28,.09); }
    .project-community-head { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding-bottom:1.2rem; border-bottom:1px solid #e8e2dc; }
    .project-community h2 { margin:0; color:#6b2228; }
    .vote-group { display:flex; gap:.5rem; }
    .vote { border:1px solid #d8d1ca; background:#fff; border-radius:10px; padding:.55rem .8rem; color:#4b5563; font:inherit; font-weight:800; cursor:pointer; }
    .vote.active[data-value="1"] { background:#dcfce7; border-color:#86efac; color:#166534; }
    .vote.active[data-value="-1"] { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
    .comments { display:grid; gap:.75rem; margin-top:1.2rem; }
    .comment { padding:1rem; border-radius:12px; background:#f8f6f3; color:#4b5563; }
    .comment strong { color:#263244; }.comment small { margin-left:.45rem; color:#7b8491; }.comment-text { margin-top:.45rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    .project-comment-actions { display:flex; flex-wrap:wrap; gap:.75rem; margin-top:.65rem; }.project-comment-action { border:0; background:none; padding:0; color:#6b2228; font:inherit; font-size:.75rem; font-weight:800; cursor:pointer; }
    .project-comment-children { display:grid; gap:.65rem; margin:.8rem 0 0 1.15rem; padding-left:.85rem; border-left:2px solid #dbcfc8; }.project-comment-children .comment { background:#fff; border:1px solid #e9e2dc; }
    .project-reply-slot { margin-top:.65rem; }.comment-form,.project-reply-form { display:flex; gap:.65rem; margin-top:1rem; }.comment-form input,.project-reply-form textarea { flex:1; min-width:0; padding:.75rem .85rem; border:1px solid #d8d1ca; border-radius:10px; font:inherit; }.project-reply-form textarea { min-height:72px; resize:vertical; }
    .comment-form button,.project-reply-form button { border:0; border-radius:10px; padding:.75rem 1rem; background:#6b2228; color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .empty,.error { padding:4rem 1rem; text-align:center; color:#687386; }.error h1 { color:#6b2228; }
    .project-header-links { display:flex; align-items:center; justify-content:center; gap:.7rem; }.project-header-links a { padding:.58rem .8rem; border-radius:10px; color:var(--muted); font-size:.76rem; font-weight:800; text-decoration:none; }.project-header-links a:hover { color:var(--wine); background:var(--sand-light); }
    html[dir="rtl"] body { font-family:"Noto Sans Arabic",Inter,sans-serif; }.project-hero h1,html[dir="rtl"] .project-summary h2 { letter-spacing:0; }html[dir="rtl"] .project-side { padding-left:0; padding-right:1.5rem; border-left:0; border-right:1px solid #e7e2dc; }html[dir="rtl"] .comment small { margin-left:0; margin-right:.45rem; }html[dir="rtl"] .project-comment-children { margin-left:0; margin-right:1.15rem; padding-left:0; padding-right:.85rem; border-left:0; border-right:2px solid #dbcfc8; }
    @media (max-width:760px) {
      .project-header-links { display:none; }
      .project-hero { min-height:350px; padding:7.2rem .9rem 3.4rem; }.project-hero h1 { font-size:clamp(2.2rem,13vw,3.9rem); }
      .project-shell { margin:-1.2rem auto 0; padding:0 .7rem 3rem; }.project-summary { grid-template-columns:1fr; padding:1.25rem; gap:1.25rem; border-radius:16px; }
      .project-side,html[dir="rtl"] .project-side { padding:1rem 0 0; border-left:0; border-right:0; border-top:1px solid #e7e2dc; }.project-stage { padding:.45rem; border-radius:16px; }.project-stage iframe { min-height:560px; border-radius:12px; }
      .project-community { padding:1.2rem; border-radius:16px; }.project-community-head { align-items:flex-start; flex-direction:column; }.comment-form,.project-reply-form { flex-direction:column; }.project-comment-children { margin-left:.45rem; padding-left:.55rem; }
    }
  </style>
</head>
<body>
  <header class="community-topbar">
    <div class="topbar-inner">
      <a class="community-wordmark" href="community.html" aria-label="AIAS Basra Community home"><span class="logo-frame"><img src="static/images/branding/LOGO.png" alt=""></span><span><strong>AIAS Basra</strong><small data-en="Community" data-ar="المجتمع">Community</small></span></a>
      <nav class="project-header-links" aria-label="Community project navigation"><a href="community.html" data-en="Community feed" data-ar="منشورات المجتمع">Community feed</a><a href="community.html?view=selected" data-en="Selected projects" data-ar="المشاريع المختارة">Selected projects</a></nav>
      <div class="topbar-actions"><button class="community-language-toggle" id="projectLanguageToggle" type="button" aria-label="Switch language"><span id="projectLanguageLabel">العربية</span></button><a class="topbar-avatar" id="memberAction" href="login.html" aria-label="Sign in"><span>?</span></a></div>
    </div>
  </header>
  <div id="projectPage"><div class="empty" data-en="Loading project…" data-ar="جارٍ تحميل المشروع…">Loading project…</div></div>

  <nav class="mobile-nav" aria-label="Community navigation"><a href="community.html"><span aria-hidden="true">⌂</span><small data-en="Home" data-ar="الرئيسية">Home</small></a><a href="community.html?view=selected"><span aria-hidden="true">◇</span><small data-en="Selected" data-ar="المختارة">Selected</small></a><a class="mobile-create" href="community.html?view=post"><span aria-hidden="true">+</span><small data-en="Create" data-ar="إنشاء">Create</small></a><a id="mobileProfile" href="community.html?view=profile"><span aria-hidden="true">◉</span><small data-en="Profile" data-ar="الملف">Profile</small></a><a href="index.html"><span aria-hidden="true">←</span><small data-en="Website" data-ar="الموقع">Website</small></a></nav>

  <script src="/js/app-open-prompt.js?v=20260811" defer></script>
  <script type="module">
    import { initializeApp, getApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const config = {apiKey:'AIzaSyAyLFqSWDyLShllJIoqsr2Jjme47OJTPKQ',authDomain:'aias-bsr.firebaseapp.com',projectId:'aias-bsr',storageBucket:'aias-bsr.firebasestorage.app',messagingSenderId:'78055223814',appId:'1:78055223814:web:99460402c2b1fcd5ae8987'};
    let app; try { app = getApp(); } catch { app = initializeApp(config); }
    const auth = getAuth(app), db = getFirestore(app);
    const projectId = new URLSearchParams(location.search).get('communityPost');
    const page = document.getElementById('projectPage');
    let currentUser = null, profile = null, project = null;
    let currentLanguage = localStorage.getItem('language') === 'ar' ? 'ar' : 'en';
    const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const tr = (english, arabic) => currentLanguage === 'ar' ? arabic : english;

    function applyLanguage() {
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
      document.body.dir = document.documentElement.dir;
      document.querySelectorAll('[data-en][data-ar]').forEach(element => {
        const copy = element.getAttribute('data-' + currentLanguage);
        if (!element.children.length) element.textContent = copy;
        else {
          const node = [...element.childNodes].find(item => item.nodeType === 3 && item.textContent.trim());
          if (node) node.textContent = copy;
        }
      });
      document.getElementById('projectLanguageLabel').textContent = currentLanguage === 'ar' ? 'EN' : 'العربية';
      document.getElementById('projectLanguageToggle').setAttribute('aria-label', tr('Switch to Arabic','التبديل إلى الإنجليزية'));
      document.getElementById('memberAction').setAttribute('aria-label', currentUser ? tr('Open your community profile','افتح ملفك المجتمعي') : tr('Sign in','تسجيل الدخول'));
      if (project) renderProject();
    }

    async function voteState() {
      const snapshot = await getDocs(collection(db, 'communityPosts', projectId, 'votes'));
      return {score:snapshot.docs.reduce((total, item) => total + (Number(item.data().value) || 0), 0), mine:snapshot.docs.find(item => item.id === currentUser?.uid)?.data().value || 0};
    }

    function renderProjectComment(comment, byParent) {
      const children = byParent.get(comment.id) || [];
      const date = comment.createdAt?.toDate ? comment.createdAt.toDate().toLocaleString(currentLanguage === 'ar' ? 'ar-IQ' : 'en') : tr('Just now','الآن');
      const replies = currentLanguage === 'ar' ? children.length.toLocaleString('ar-IQ') + ' ردود' : children.length + ' ' + (children.length === 1 ? 'reply' : 'replies');
      return `<article class="comment"><div><strong>${escapeHtml(comment.userName || tr('Member','عضو'))}</strong><small>${date}</small></div><div class="comment-text">${escapeHtml(comment.text)}</div><div class="project-comment-actions">${currentUser ? `<button class="project-comment-action" type="button" data-project-reply="${comment.id}" data-project-name="${escapeHtml(comment.userName || tr('Member','عضو'))}">${tr('Reply','رد')}</button>` : ''}${children.length ? `<button class="project-comment-action" type="button" data-project-thread="${comment.id}" aria-expanded="false">${tr('View ','عرض ')}${replies}</button>` : ''}${currentUser?.uid === comment.userId ? `<button class="project-comment-action" type="button" data-project-delete="${comment.id}">${tr('Delete','حذف')}</button>` : ''}</div><div class="project-reply-slot"></div>${children.length ? `<div class="project-comment-children" data-project-children="${comment.id}" hidden>${children.map(child => renderProjectComment(child, byParent)).join('')}</div>` : ''}</article>`;
    }

    async function postProjectComment(text, parentId = null) {
      if (!currentUser || !text.trim()) return;
      await addDoc(collection(db, 'communityPosts', projectId, 'comments'), {userId:currentUser.uid, userName:profile?.displayName || currentUser.displayName || tr('Member','عضو'), text:text.trim(), parentId, createdAt:serverTimestamp()});
      await renderCommunity();
    }

    async function renderCommunity() {
      const [vote, commentsSnapshot] = await Promise.all([voteState(), getDocs(collection(db, 'communityPosts', projectId, 'comments'))]);
      const comments = commentsSnapshot.docs.map(item => ({id:item.id, ...item.data()})).sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      const byParent = new Map();
      comments.forEach(comment => { const parent = comments.some(item => item.id === comment.parentId) ? comment.parentId : null; if (!byParent.has(parent)) byParent.set(parent, []); byParent.get(parent).push(comment); });
      byParent.forEach(items => items.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)));
      const roots = byParent.get(null) || [];
      const box = document.getElementById('projectCommunity');
      const commentCount = currentLanguage === 'ar' ? comments.length.toLocaleString('ar-IQ') + ' تعليق' : comments.length + ' ' + (comments.length === 1 ? 'comment' : 'comments');
      box.innerHTML = `<div class="project-community-head"><div><h2>${tr('Project discussion','نقاش المشروع')}</h2><p style="margin:.35rem 0 0;color:#687386">${commentCount}</p></div><div class="vote-group"><button class="vote ${vote.mine === 1 ? 'active' : ''}" data-value="1" aria-label="${tr('Applaud project','صفّق للمشروع')}">▲ ${vote.score}</button><button class="vote ${vote.mine === -1 ? 'active' : ''}" data-value="-1" aria-label="${tr('Downvote project','تصويت سلبي للمشروع')}">▼</button></div></div><div class="comments">${roots.length ? roots.map(comment => renderProjectComment(comment, byParent)).join('') : '<p style="color:#687386">'+tr('No comments yet. Start the conversation.','لا توجد تعليقات بعد. ابدأ الحوار.')+'</p>'}</div>${currentUser ? '<form class="comment-form"><input required maxlength="2000" placeholder="'+tr('Share feedback on this project','شارك ملاحظاتك حول هذا المشروع')+'"><button>'+tr('Comment','تعليق')+'</button></form>' : '<p style="margin-top:1rem;color:#687386"><a href="login.html">'+tr('Sign in','تسجيل الدخول')+'</a> '+tr('to vote or comment.','للتصويت أو التعليق.')+'</p>'}`;
      box.querySelectorAll('[data-value]').forEach(button => button.addEventListener('click', async () => { if (!currentUser) { location.href = 'login.html'; return; } await setDoc(doc(db, 'communityPosts', projectId, 'votes', currentUser.uid), {userId:currentUser.uid, value:Number(button.dataset.value), updatedAt:serverTimestamp()}); renderCommunity(); }));
      box.querySelectorAll('[data-project-thread]').forEach(button => button.addEventListener('click', () => { const children = box.querySelector(`[data-project-children="${button.dataset.projectThread}"]`); if (!children) return; children.hidden = !children.hidden; button.setAttribute('aria-expanded', String(!children.hidden)); const count = currentLanguage === 'ar' ? children.children.length.toLocaleString('ar-IQ') + ' ردود' : children.children.length + ' ' + (children.children.length === 1 ? 'reply' : 'replies'); button.textContent = children.hidden ? tr('View ','عرض ') + count : tr('Hide replies','إخفاء الردود'); }));
      box.querySelectorAll('[data-project-reply]').forEach(button => button.addEventListener('click', () => { box.querySelectorAll('.project-reply-slot').forEach(slot => { slot.innerHTML = ''; }); const slot = button.closest('.comment').querySelector('.project-reply-slot'); slot.innerHTML = `<form class="project-reply-form"><textarea required maxlength="2000" placeholder="${tr('Reply to ','الرد على ')}${escapeHtml(button.dataset.projectName)}"></textarea><button>${tr('Reply','رد')}</button></form>`; slot.querySelector('textarea').focus(); slot.querySelector('form').addEventListener('submit', async event => { event.preventDefault(); await postProjectComment(event.target.querySelector('textarea').value, button.dataset.projectReply); }); }));
      box.querySelectorAll('[data-project-delete]').forEach(button => button.addEventListener('click', async () => { await deleteDoc(doc(db, 'communityPosts', projectId, 'comments', button.dataset.projectDelete)); renderCommunity(); }));
      box.querySelector('.comment-form')?.addEventListener('submit', async event => { event.preventDefault(); await postProjectComment(event.target.querySelector('input').value); });
    }

    function selectionControl() {
      if (project.featured) return `<span class="selection-status">${tr('Selected by AIAS Basra','مختار من AIAS البصرة')}</span>`;
      if (currentUser?.uid !== project.userId) return '';
      if (project.featureRequest && project.featureStatus === 'pending') return `<div class="selection-request"><strong>${tr('Selection request submitted','تم إرسال طلب الاختيار')}</strong><p>${tr('The chapter team will review this project.','سيراجع فريق الفرع هذا المشروع.')}</p></div>`;
      if (project.featureStatus === 'denied') return `<div class="selection-request"><strong>${tr('Review completed','اكتملت المراجعة')}</strong><p>${tr('This project was not selected in this review round.','لم يتم اختيار هذا المشروع في جولة المراجعة الحالية.')}</p></div>`;
      return `<div class="selection-request"><strong>${tr('Apply for Selected Projects','قدّم للمشاريع المختارة')}</strong><p>${tr('Send this project to the AIAS Basra team for curation review.','أرسل هذا المشروع إلى فريق AIAS البصرة لمراجعته واختياره.')}</p><button id="requestSelection" type="button">${tr('Request selection','طلب الاختيار')}</button></div>`;
    }

    function renderProject() {
      const date = project.createdAt?.toDate ? project.createdAt.toDate().toLocaleDateString(currentLanguage === 'ar' ? 'ar-IQ' : 'en', {dateStyle:'long'}) : tr('Community project','مشروع مجتمعي');
      page.innerHTML = `<section class="project-hero"><div class="container"><div class="project-kicker">${tr('Community project','مشروع مجتمعي')}</div><h1>${escapeHtml(project.title)}</h1><div class="project-meta"><span>${tr('By ','بواسطة ')}${escapeHtml(project.authorName || tr('Community member','عضو في المجتمع'))}</span><span>${escapeHtml(date)}</span></div></div></section><main class="project-shell"><section class="project-summary"><div><h2>${tr('About the project','عن المشروع')}</h2><p>${escapeHtml(project.summary)}</p></div><aside class="project-side"><span class="project-badge">${project.featured ? tr('Selected by AIAS Basra','مختار من AIAS البصرة') : tr('Community submission','مشاركة مجتمعية')}</span><a href="/p/${encodeURIComponent(project.authorUsername || project.userId)}">${tr('View creator profile →','عرض ملف صاحب المشروع ←')}</a>${selectionControl()}</aside></section><section class="project-stage"><iframe title="${escapeHtml(project.title)}" src="${escapeHtml(project.behanceSrc)}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section><section id="projectCommunity" class="project-community"><p class="empty">${tr('Loading discussion…','جارٍ تحميل النقاش…')}</p></section></main>`;
      document.title = `${project.title || tr('Community Project','مشروع مجتمعي')} — AIAS Basra`;
      document.getElementById('requestSelection')?.addEventListener('click', requestProjectSelection);
      renderCommunity().catch(error => { console.error(error); document.getElementById('projectCommunity').innerHTML = '<p class="error">'+tr('The project discussion is unavailable right now.','نقاش المشروع غير متاح حالياً.')+'</p>'; });
    }

    async function requestProjectSelection() {
      if (!currentUser || currentUser.uid !== project.userId || project.featured) return;
      const button = document.getElementById('requestSelection');
      if (button) { button.disabled = true; button.textContent = tr('Sending…','جارٍ الإرسال…'); }
      try {
        await updateDoc(doc(db, 'communityPosts', projectId), {featureRequest:true, featureStatus:'pending', selectionRequestedAt:serverTimestamp()});
        project.featureRequest = true;
        project.featureStatus = 'pending';
        renderProject();
      } catch (error) {
        console.error(error);
        if (button) { button.disabled = false; button.textContent = tr('Try again','حاول مجدداً'); }
      }
    }

    async function loadProject() {
      try {
        if (!projectId) throw new Error(tr('Project ID is missing.','معرّف المشروع مفقود.'));
        const snapshot = await getDoc(doc(db, 'communityPosts', projectId));
        if (!snapshot.exists() || snapshot.data().type !== 'behance' || snapshot.data().published === false) throw new Error(tr('Project not found.','المشروع غير موجود.'));
        project = {id:snapshot.id, ...snapshot.data()};
        renderProject();
      } catch (error) { console.error(error); page.innerHTML = '<main class="error" style="padding-top:10rem"><h1>'+tr('Project unavailable','المشروع غير متاح')+'</h1><p>'+tr('This project could not be found.','تعذر العثور على هذا المشروع.')+'</p><p><a href="community.html?view=selected">'+tr('Browse community projects','تصفح مشاريع المجتمع')+'</a></p></main>'; }
    }

    document.getElementById('projectLanguageToggle').addEventListener('click', () => { currentLanguage = currentLanguage === 'ar' ? 'en' : 'ar'; localStorage.setItem('language', currentLanguage); applyLanguage(); });
    applyLanguage();
    onAuthStateChanged(auth, async user => {
      currentUser = user;
      if (user) {
        const snapshot = await getDoc(doc(db, 'users', user.uid));
        profile = snapshot.exists() ? snapshot.data() : null;
        const profileHref = '/p/' + encodeURIComponent(profile?.username || user.uid);
        document.getElementById('memberAction').href = profileHref;
        document.getElementById('mobileProfile').href = profileHref;
        document.getElementById('memberAction').setAttribute('aria-label', tr('Open your community profile','افتح ملفك المجتمعي'));
        const displayName = profile?.displayName || user.displayName || tr('Member','عضو');
        const photo = profile?.photoBase64 || profile?.photoURL || user.photoURL || '';
        document.getElementById('memberAction').innerHTML = photo ? '<img src="'+escapeHtml(photo)+'" alt="">' : '<span>'+escapeHtml(displayName.slice(0,2).toUpperCase())+'</span>';
      } else {
        profile = null;
        document.getElementById('memberAction').setAttribute('aria-label', tr('Sign in','تسجيل الدخول'));
      }
      if (project) renderProject();
    });
    loadProject();
