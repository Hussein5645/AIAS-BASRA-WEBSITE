<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Community Moderation - AIAS Basra</title>
  <link rel="icon" href="static/images/branding/LOGO.png"><link rel="stylesheet" href="css/style.css">
  <style>
    :root{--wine:#6b2228;--clay:#9b5e4d;--ink:#1f2937;--muted:#64748b;--line:#e2e8f0;--bg:#f5f2ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.head{padding:1.2rem;color:#fff;background:linear-gradient(135deg,#321c22,var(--wine),var(--clay))}.head-inner,.page{max-width:1280px;margin:auto}.head-inner{display:flex;justify-content:space-between;align-items:center;gap:1rem}.head h1{margin:0;font-size:1.35rem}.head p{margin:.25rem 0 0;color:#ead8d3;font-size:.8rem}.head a{color:#fff;text-decoration:none;border:1px solid #ffffff80;border-radius:8px;padding:.5rem .7rem;font-weight:700}.page{padding:1rem}.notice{display:none;padding:.75rem;border-radius:10px;margin-bottom:.8rem}.notice.show{display:block}.notice.ok{color:#166534;background:#dcfce7}.notice.error{color:#991b1b;background:#fee2e2}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(130px,180px));gap:.6rem;padding:.8rem;background:#fff;border:1px solid var(--line);border-radius:14px}.toolbar input,.toolbar select,.dialog-form textarea,.dialog-form input{width:100%;padding:.65rem;border:1px solid var(--line);border-radius:8px;font:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin:.8rem 0}.stat{padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:12px}.stat strong,.stat span{display:block}.stat strong{font-size:1.25rem;color:var(--wine)}.stat span{font-size:.72rem;color:var(--muted)}.tabs{display:flex;gap:.4rem;margin-bottom:.7rem}.tabs button{padding:.55rem .8rem;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:800;cursor:pointer}.tabs button.active{color:#fff;background:var(--wine)}.list{display:grid;gap:.65rem}.item{padding:.9rem;background:#fff;border:1px solid var(--line);border-radius:13px}.item-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem}.item h2{margin:0;font-size:.95rem}.meta{margin:.3rem 0;color:var(--muted);font-size:.73rem}.badges{display:flex;gap:.35rem;flex-wrap:wrap}.badge{padding:.18rem .45rem;border-radius:999px;background:#e2e8f0;font-size:.67rem;font-weight:800}.badge.flagged{color:#991b1b;background:#fee2e2}.badge.archived{color:#92400e;background:#fef3c7}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.35rem}.actions button{border:0;border-radius:7px;padding:.42rem .58rem;color:#fff;background:#475569;font-weight:800;cursor:pointer}.actions .warn{background:#d97706}.actions .flag{background:#be123c}.actions .restore{background:#15803d}.actions .delete{background:#991b1b}.details{margin-top:.7rem;padding:.7rem;background:#f8fafc;border-radius:8px;white-space:pre-wrap;font-size:.78rem;line-height:1.55}.state{padding:2rem;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}dialog{width:min(520px,calc(100% - 2rem));border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px #0f172a55}dialog::backdrop{background:#0f172a88}.dialog-form{padding:1rem}.dialog-form h2{margin:.1rem 0}.dialog-form p{color:var(--muted);font-size:.8rem}.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.8rem}.dialog-actions button{padding:.55rem .75rem;border:0;border-radius:8px;font-weight:800;cursor:pointer}.primary{color:#fff;background:var(--wine)}@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.item-head{grid-template-columns:1fr}.actions{justify-content:flex-start}.head-inner{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="head"><div class="head-inner"><div><h1>Community moderation</h1><p>Flagging records a review state; it does not hide content. Delete archives content first.</p></div><a href="https://www.aiasbsr.com/admin-dashboard.html">Back to dashboard</a></div></header>
  <main class="page">
    <div id="notice" class="notice" role="status"></div>
    <section class="toolbar" aria-label="Moderation filters"><input id="search" type="search" placeholder="Search titles, authors, spaces, or reasons"><select id="type"><option value="all">Posts and spaces</option><option value="post">Posts</option><option value="space">Spaces</option></select><select id="status"><option value="all">All statuses</option><option value="clear">Not flagged</option><option value="flagged">Flagged</option></select><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></section>
    <section class="summary"><article class="stat"><strong id="postCount">—</strong><span>Active posts</span></article><article class="stat"><strong id="spaceCount">—</strong><span>Active spaces</span></article><article class="stat"><strong id="flagCount">—</strong><span>Flagged</span></article><article class="stat"><strong id="archiveCount">—</strong><span>Archived</span></article></section>
    <nav class="tabs"><button id="activeTab" class="active">Moderation</button><button id="archiveTab">Archived content</button><button id="auditTab">Audit history</button></nav>
    <section id="results" class="list"><div class="state">Checking administrator access…</div></section>
  </main>
  <dialog id="actionDialog"><form id="actionForm" class="dialog-form"><h2 id="dialogTitle">Moderation action</h2><p id="dialogHelp"></p><label>Reason<textarea id="reason" maxlength="500" required rows="4" placeholder="Explain the moderation decision"></textarea></label><p id="dialogStatus" class="archive-status" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="cancelAction" type="button">Cancel</button><button id="confirmAction" type="submit" class="primary">Confirm</button></div></form></dialog>
  <script type="module">
    import {initializeApp,getApp} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import {collection,getDocs,getFirestore} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import {canManage,canView,getAdminAccess} from './js/rbac.js';
    import {moderateCommunityContent,permanentlyDeleteCommunityContent} from './js/community-moderation.js';
    const config={apiKey:'AIzaSyAvPMOgz1w7SFylBY8cmn9nf9GQvn-IRNI',authDomain:'space-42d87.firebaseapp.com',projectId:'space-42d87',storageBucket:'space-42d87.firebasestorage.app',messagingSenderId:'658382934950',appId:'1:658382934950:web:c61b6fa237b203e6bf7567'};
    let app;try{app=getApp()}catch{app=initializeApp(config)}const auth=getAuth(app),db=getFirestore(app);
    let user,access,items=[],audit=[],view='active',pendingAction=null;
    const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time=value=>value?.toDate?.().toLocaleString()||'Pending';
    function show(message,type='ok'){$('notice').className=`notice show ${type}`;$('notice').textContent=message;setTimeout(()=>{$('notice').className='notice'},5000)}
    async function load(){ $('results').innerHTML='<div class="state">Loading community moderation data…</div>';try{const [posts,spaces,audits]=await Promise.all([getDocs(collection(db,'communityPosts')),getDocs(collection(db,'communitySpaces')),getDocs(collection(db,'communityModerationAudit'))]);items=[...posts.docs.map(d=>({id:d.id,contentType:'post',...d.data()})),...spaces.docs.map(d=>({id:d.id,contentType:'space',...d.data()}))];audit=audits.docs.map(d=>({id:d.id,...d.data()}));render()}catch(error){$('results').innerHTML='<div class="state">Could not load moderation data. Retry from the dashboard.</div>';show(error.message||'Loading failed.','error')}}
    function filtered(){const q=$('search').value.trim().toLowerCase(),type=$('type').value,status=$('status').value;return items.filter(item=>(view==='archive')===(item.archived===true)).filter(item=>type==='all'||item.contentType===type).filter(item=>status==='all'||(status==='flagged'?item.moderationStatus==='flagged':item.moderationStatus!=='flagged')).filter(item=>!q||[item.title,item.name,item.content,item.description,item.authorName,item.authorUsername,item.creatorUsername,item.moderationReason,item.archiveReason].join(' ').toLowerCase().includes(q)).sort((a,b)=>{const av=(a.createdAt||a.archivedAt)?.seconds||0,bv=(b.createdAt||b.archivedAt)?.seconds||0;return $('sort').value==='oldest'?av-bv:bv-av})}
    function render(){ $('postCount').textContent=items.filter(i=>i.contentType==='post'&&i.archived!==true).length;$('spaceCount').textContent=items.filter(i=>i.contentType==='space'&&i.archived!==true).length;$('flagCount').textContent=items.filter(i=>i.moderationStatus==='flagged').length;$('archiveCount').textContent=items.filter(i=>i.archived===true).length;if(view==='audit'){renderAudit();return}const records=filtered();$('results').innerHTML=records.length?records.map(item=>{const name=item.title||item.name||item.id,owner=item.authorUsername||item.authorName||item.creatorUsername||item.userId||item.creatorId||'Unknown';const body=item.content||item.summary||item.description||'';return `<article class="item"><div class="item-head"><div><h2>${esc(name)}</h2><p class="meta">${esc(item.contentType)} · ${esc(owner)} · ${time(item.createdAt||item.archivedAt)}</p><div class="badges"><span class="badge">${esc(item.type||item.contentType)}</span>${item.moderationStatus==='flagged'?'<span class="badge flagged">flagged</span>':''}${item.archived===true?`<span class="badge archived">archived · ${esc(item.archiveCause||'moderation')}</span>`:''}</div></div><div class="actions">${view==='active'?`<button data-action="${item.moderationStatus==='flagged'?'clear_flag':'flag'}" data-type="${item.contentType}" data-id="${esc(item.id)}" class="flag">${item.moderationStatus==='flagged'?'Clear flag':'Flag'}</button><button data-action="warn" data-type="${item.contentType}" data-id="${esc(item.id)}" class="warn">Warn</button><button data-action="archive" data-type="${item.contentType}" data-id="${esc(item.id)}" class="delete">Delete (archive)</button>`:`<button data-action="restore" data-type="${item.contentType}" data-id="${esc(item.id)}" class="restore">Restore</button><button data-action="permanent_delete" data-type="${item.contentType}" data-id="${esc(item.id)}" class="delete">Permanently delete</button>`}</div></div><details><summary class="meta">Inspect content and moderation state</summary><div class="details">${esc(body)}\n\nReason: ${esc(item.moderationReason||item.archiveReason||'None')}\nSpace: ${esc(item.communitySlug||item.slug||'main')}\nID: ${esc(item.id)}</div></details></article>`}).join(''):'<div class="state">No results match these filters.</div>';bindActions()}
    function renderAudit(){const q=$('search').value.trim().toLowerCase(),rows=audit.filter(i=>!q||[i.action,i.contentType,i.contentId,i.reason,i.moderatorEmail].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('results').innerHTML=rows.length?rows.map(i=>`<article class="item"><h2>${esc(i.action)} · ${esc(i.contentType)}</h2><p class="meta">${esc(i.moderatorEmail)} · ${time(i.createdAt)} · ${esc(i.contentId)}</p><div class="details">${esc(i.reason||'No reason recorded')}${i.cascadeId?`\nCascade: ${esc(i.cascadeId)}`:''}</div></article>`).join(''):'<div class="state">No audit entries match this search.</div>'}
    function bindActions(){document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>openAction(button.dataset))}
    function openAction(data){if(!canManage(access,'community')){show('You have view-only Community access.','error');return}pendingAction=data;$('reason').value='';$('dialogStatus').textContent='';$('dialogStatus').className='archive-status';const permanent=data.action==='permanent_delete';$('dialogTitle').textContent=permanent?'Permanently delete archived content':data.action.replace('_',' ');$('dialogHelp').textContent=permanent?'This permanently removes the content and cannot be undone or restored. Confirm only when you are certain.':'The reason is stored in audit history and sent to the affected user.';$('confirmAction').textContent=permanent?'Permanently delete':'Confirm';$('actionDialog').showModal()}
    $('cancelAction').addEventListener('click',()=>{$('actionDialog').close();pendingAction=null});
    $('actionForm').addEventListener('submit',async event=>{event.preventDefault();if(!pendingAction)return;const action={...pendingAction};const button=$('confirmAction');const status=$('dialogStatus');button.disabled=true;$('cancelAction').disabled=true;status.className='archive-status';status.textContent=action.action==='permanent_delete'?'Permanently deleting…':'Saving moderation action…';try{if(action.action==='permanent_delete')await permanentlyDeleteCommunityContent(db,user,{contentType:action.type,contentId:action.id,reason:$('reason').value});else await moderateCommunityContent(db,user,{action:action.action,contentType:action.type,contentId:action.id,reason:$('reason').value});status.className='archive-status success';status.textContent=action.action==='permanent_delete'?'Content permanently deleted. It cannot be restored.':'Moderation action completed.';await load();setTimeout(()=>{$('actionDialog').close();pendingAction=null},500)}catch(error){status.className='archive-status error';status.textContent=error.message||'Action failed. Check your administrator permissions and try again.'}finally{button.disabled=false;$('cancelAction').disabled=false}});
    ['search','type','status','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
    function setView(next){view=next;['active','archive','audit'].forEach(name=>$(`${name}Tab`).classList.toggle('active',name===next));render()}$('activeTab').onclick=()=>setView('active');$('archiveTab').onclick=()=>setView('archive');$('auditTab').onclick=()=>setView('audit');
    onAuthStateChanged(auth,async current=>{if(!current){location.href='login.html?next=admin-community-moderation.html';return}user=current;access=await getAdminAccess(db,current.email);if(!canView(access,'community')){location.href='https://www.aiasbsr.com/admin-dashboard.html';return}await load()});
  </script>
</body></html>
